function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  for (let i=0;i<text.length;i++){ const c=text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
    else if (c==='"') q=true; else if (c===','){ row.push(cur); cur=''; } else if (c==='\n'||c==='\r'){ if (c==='\r'&&text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; } else cur+=c; }
  if (cur||row.length){ row.push(cur); rows.push(row); }
  return rows;
}

function resizeImage(file, size){
  return new Promise((res,rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{ const c=document.createElement('canvas'); c.width=c.height=size; const s=Math.min(img.width,img.height);
      c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.85)); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('That file is not an image Pera can read')); };
    img.src = url;
  });
}

const _storeSeed = Store.seed;
Store.seed = async function(){ const r = await _storeSeed.apply(this, arguments); demoAccountData(); return r; };
const _storeInit = Store.init;
Store.init = async function(){
  const ok = await _storeInit.apply(this, arguments);
  if (!ok || !this.me) return ok;
  demoAccountData();
  const u = this.me;
  if (!u.last_login_at || Date.now()-new Date(u.last_login_at).getTime() > 36e5){ try{ await this.update('app_users', u.id, {last_login_at:nowISO()}); }catch(e){ console.warn('Could not record sign-in time', e); } }
  try{ await docReminders(); }catch(e){ console.warn(e); }
  return ok;
};
/* personal reminder before a supplier's compliance document expires (Profile → Email & alerts) */
async function docReminders(){
  const u = me(), days = +prefsOf(u).doc_reminder || 0;
  if (!days || !can.procure(u)) return;
  const until = addDays(todayStr(), days), have = new Set(Store.all('notifications').filter(n=>n.user_id===u.id).map(n=>n.message));
  for (const s of Store.all('suppliers').filter(s=>s.status!=='blacklisted')) for (const d of (s.documents||[])){
    if (!d.expiry || d.expiry > until) continue;
    const msg = s.name+': '+d.type+(d.expiry<todayStr()?' expired on ':' expires on ')+fmtDate(d.expiry);
    if (!have.has(msg)) await Store.notify([u.id], 'supplier', s, msg);
  }
}

/* ---------- possible duplicates: same amount, and the same or a similar supplier / payee / name, within 45 days ---------- */
const normName = s => String(s||'').toLowerCase().replace(/\b(pvt|private|ltd|limited|t\/a|inc|co|the)\b/g,'').replace(/[^a-z0-9]/g,'');
function similarity(a, b){
  a = normName(a); b = normName(b);
  if (!a || !b) return 0; if (a===b) return 1;
  const m = a.length, n = b.length; if (Math.abs(m-n) > Math.max(m,n)*0.3) return 0;
  let prev = Array.from({length:n+1},(_,j)=>j);
  for (let i=1;i<=m;i++){ const cur=[i]; for (let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
  return 1 - prev[n]/Math.max(m,n);
}
function findDuplicates(d){
  const base = toBase(d.currency, d.total); if (!base) return [];
  const when = new Date(d.submitted_at || d.created_at || nowISO()).getTime();
  const who = x => x.supplier_id ? Store.supName(x.supplier_id) : (x.payee||'');
  return Store.all('requisitions')
    .filter(r=>r.id!==d.id && !['draft','withdrawn','rejected'].includes(r.status) && (r.kind==='expense')===(d.kind==='expense'))
    .filter(r=>Math.abs(new Date(r.submitted_at||r.created_at).getTime() - when) <= 45*864e5)
    .filter(r=>Math.abs(toBase(r.currency,r.total) - base) <= Math.max(0.01, base*0.02))
    .map(r=>{ const why = [];
      if (d.supplier_id && d.supplier_id===r.supplier_id) why.push('same supplier');
      else { const p = similarity(who(d), who(r)); if (p>=0.8) why.push(p===1?'same payee':'similar payee'); }
      const t = similarity(d.title, r.title); if (t>=0.8) why.push(t===1?'same name':'similar name');
      return {r, why}; })
    .filter(x=>x.why.length)
    .map(x=>({r:x.r, why:x.why.concat(['same amount'])}));
}
const dupGap = (a, b) => { const m = Math.round(Math.abs(new Date(a.submitted_at||a.created_at)-new Date(b.submitted_at||b.created_at||nowISO()))/6e4); return m<60 ? m+' minute'+(m===1?'':'s') : m<2880 ? Math.round(m/60)+' hours' : Math.round(m/1440)+' days'; };
const dupListHTML = (list, d) => list.map(x=>`<li><button class="link mono" data-open="${x.r.kind==='expense'?'expense':'requisition'}:${x.r.id}">${esc(x.r.number)}</button> ${esc(x.r.title)} · ${fmtMoney(x.r.currency,x.r.total)} · ${esc(STAGE[reqStage(x.r)]?STAGE[reqStage(x.r)][0]:x.r.status)} — <i>${esc(x.why.join(', '))}</i>, ${dupGap(x.r,d)} apart</li>`).join('');

/* ---------- bank details typed into a justification ---------- */
const BANK_WORDS = /\b(acc(?:oun)?t\s*(?:no|num(?:ber)?|#)|a\/c\s*(?:no)?|iban|swift|bic|branch\s*code|sort\s*code|routing\s*(?:no|number)|bank\s*:)/i;
const bankDigits = t => (String(t||'').match(/\d(?:[\s-]?\d){8,}/g)||[]).map(s=>s.replace(/\D/g,'')).filter(s=>s.length>=9 && s.length<=20);
function bankCheck(text, supplierId, payee){
  if (!BANK_WORDS.test(String(text||''))) return null;
  const nums = bankDigits(text), s = Store.sup(supplierId), onFile = s ? bankDigits(s.bank_details) : [];
  const tail = n => '…'+n.slice(-4);
  if (s && nums.length && onFile.length && !nums.every(n=>onFile.includes(n)))
    return {tone:'red', text:`<b>Bank details in the justification don’t match ${esc(s.name)}’s verified record</b> (notes say ${nums.map(tail).join(', ')}; the supplier record says ${onFile.map(tail).join(', ')}). Pay only to the verified record. If the supplier really changed banks, update the supplier record so Finance is alerted and confirms the change.`};
  if (s) return {tone:'blue', text:`The justification mentions bank details. Pera pays ${esc(s.name)} only to the bank details on its supplier record${onFile.length?' (…'+onFile[0].slice(-4)+')':' — which has none yet, so add them there'}.`};
  return {tone:'amber', text:`<b>Bank details for ${esc(payee||'this payee')} are only typed into the justification</b>, so nobody has verified them. Add the payee as a supplier: bank details on a supplier record are checked, and any change alerts Finance.`};
}

  ['expenses','Expense claims','Staff claim back money they have already spent'],

  ['contracts','Contracts','Supplier agreements, renewals, amendments and call-offs'],

  ['portal','Supplier portal','Suppliers quote, see their orders and send invoices online']];
const CORE_MODULES = 'Requisitions, approvals, purchase orders, deliveries, invoices, payments, suppliers, items, reports and the audit trail';
const mod = k => ((S()||{}).modules||{})[k] !== false;
const MOD_VIEWS = {expenses:['expenses'], requests:['requests','request'], contracts:['contracts','contract'], rfq:['rfqs','rfq'], plan:['plan'], budgets:['budgets']};
const MOD_ACTS = {'new-expense':'expenses', 'new-request':'requests', 'new-contract':'contracts', 'ct-new':'contracts', 'rfq-new':'rfq', scan:'scan', 'sup-invite':'portal', 'stock-adj':'inventory', 'budget-new':'budgets', 'plan-new':'plan'};

/* ---------- approval reminders & escalation ---------- */
const remCfg = () => Object.assign({enabled:true, reminder_hours:24, escalate_hours:72, escalate_to:[]}, S().reminders||{});
const hoursSince = iso => (Date.now() - new Date(iso).getTime()) / 36e5;
const ageText = h => h < 1 ? Math.max(1, Math.round(h*60))+' min' : h < 48 ? Math.round(h)+' h' : Math.round(h/24)+' days';
/* when the step now waiting started: submission for step 1, the last approval of the step before for later steps */
function stepStart(r){
  const cur = currentStage(r), base = r.submitted_at || r.created_at;
  if (cur <= 0) return base;
  const prev = (r.approvals||[]).filter(a=>(a.stage||0)===cur-1 && a.decision==='approved').map(a=>a.at).sort();
  return prev[prev.length-1] || base;
}
function slaPill(r){
  const c = remCfg(), h = hoursSince(stepStart(r));
  const tone = c.enabled && c.escalate_hours && h >= c.escalate_hours ? 't-red' : c.enabled && c.reminder_hours && h >= c.reminder_hours ? 't-amber' : 't-grey';
  return `<span title="Waiting at this approval step since ${esc(fmtDT(stepStart(r)))}">${pill('Waiting '+ageText(h), tone)}</span>`;
}
const pendingApprovals = () => [].concat(
  Store.all('requisitions').filter(r=>r.status==='pending').map(r=>({t:'requisitions', type:r.kind==='expense'?'expense':'requisition', r})),
  Store.all('purchase_orders').filter(r=>r.status==='pending_approval').map(r=>({t:'purchase_orders', type:'po', r})),
  Store.all('contracts').filter(r=>r.status==='pending').map(r=>({t:'contracts', type:'contract', r})));
const recLabel = r => r.number+' – '+(r.title || 'Purchase order to '+Store.supName(r.supplier_id));
async function runReminders(){
  const c = remCfg(); if (!c.enabled) return 0;
  if (LIVE){ try{ const {data, error} = await Store.sb.rpc('run_reminders'); if (error) throw error; if (data) await Store.reloadTables(['notifications','audit_log']); return data||0; }catch(e){ console.warn('Reminders not run:', e.message||e); return 0; } }
  let sent = 0;
  for (const {type, r} of pendingApprovals()){
    const cur = currentStage(r); if (cur < 0) continue;
    const s = stagesOf(r)[cur], start = stepStart(r), h = hoursSince(start);
    if (c.reminder_hours && h >= c.reminder_hours){
      const waiting = s.ids.filter(id=>!(r.approvals||[]).some(a=>a.approver_id===id && (a.stage||0)===cur));
      for (const id of waiting){
        const last = Store.all('notifications').filter(n=>n.user_id===id && n.entity_id===r.id && /^Reminder:/.test(n.message) && n.at>=start).map(n=>n.at).sort().pop();
        if (last && hoursSince(last) < c.reminder_hours) continue;
        await Store.notify(withDelegates([id]), type, r, 'Reminder: '+recLabel(r)+' has been waiting '+ageText(h)+' for your approval'); sent++;
      }
    }
    if (c.escalate_hours && h >= c.escalate_hours){
      const key = 'Escalated: '+r.number+' step '+(cur+1);
      if (!Store.all('notifications').some(n=>n.entity_id===r.id && n.message.startsWith(key))){
        const to = (c.escalate_to||[]).length ? c.escalate_to : Store.all('app_users').filter(u=>u.active && u.role==='admin').map(u=>u.id);
        await Store.notify(to.concat([r.created_by]), type, r, key+' – '+recLabel(r)+' has waited '+ageText(h)+' for '+s.ids.map(a=>Store.user(a).name).join(', '));
        Store.data.audit_log.push({id:uid(), entity_type:type, entity_id:r.id, entity_number:r.number, action:'Escalated', details:'Step '+(cur+1)+' ('+s.label+') waited '+ageText(h), user_id:null, user_name:'Pera (automatic)', at:nowISO()});
        Store.persist(); sent++;
      }
    }
  }
  return sent;
}

/* ---------- links from email: #approve/<type>/<id> and #open/<type>/<id> ---------- */
const TYPE_TABLE = {requisition:'requisitions', expense:'requisitions', po:'purchase_orders', contract:'contracts'};
function readDeepLink(){
  const m = /^#(approve|open)\/(requisition|expense|po|contract|rfq|supplier|request)\/([\w-]+)$/.exec(location.hash||'');
  if (m){ try{ sessionStorage.setItem('pera-link', location.hash); }catch(e){} return m; }
  let saved = ''; try{ saved = sessionStorage.getItem('pera-link')||''; }catch(e){}
  return saved ? /^#(approve|open)\/(\w+)\/([\w-]+)$/.exec(saved) : null;
}
function applyDeepLink(){
  const m = readDeepLink(); if (!m) return false;
  try{ sessionStorage.removeItem('pera-link'); }catch(e){}
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  const [, verb, type, id] = m;
  if (verb==='approve' && TYPE_TABLE[type]){ App.view = 'quick'; App.param = TYPE_TABLE[type]+':'+id; return true; }
  const R = {requisition:'req', expense:'req', po:'po', contract:'contract', rfq:'rfq', supplier:'supplier', request:'request'};
  if (R[type]){ App.view = R[type]; App.param = id; return true; }
  return false;
}

/* =====================================================================
   SMART SCAN — reads a quote, invoice or receipt (PDF or photo) in the
   browser and pre-fills a requisition, expense or invoice. Rule-based:
   no data leaves the browser and no paid AI service is used.
   ===================================================================== */
const SCAN_LIBS = {
  pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfWorker:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  ocr:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'
};
function loadScript(src){ return new Promise((res,rej)=>{ if ([...document.scripts].some(s=>s.src===src)) return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Could not load the document reader. Check the internet connection.')); document.head.appendChild(s); }); }
async function extractText(file, progress){
  const isPdf = /pdf/.test(file.type) || /\.pdf$/i.test(file.name);
  const isImg = /^image\//.test(file.type) || /\.(png|jpe?g|webp|bmp|gif)$/i.test(file.name);
  if (/^text\//.test(file.type) || /\.(txt|csv)$/i.test(file.name)) return await file.text();
  if (isPdf){
    await loadScript(SCAN_LIBS.pdf);
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = SCAN_LIBS.pdfWorker;
    const pdf = await window.pdfjsLib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
    const out = [];
    for (let p=1; p<=Math.min(pdf.numPages,5); p++){
      progress && progress('Reading page '+p+' of '+pdf.numPages+'…');
      const tc = await (await pdf.getPage(p)).getTextContent();
      // rebuild lines from text items by their vertical position
      const rows = {};
      tc.items.forEach(it=>{ const y = Math.round(it.transform[5]/3); (rows[y]=rows[y]||[]).push([it.transform[4], it.str]); });
      Object.keys(rows).sort((a,b)=>b-a).forEach(y=>out.push(rows[y].sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(' ').replace(/\s+/g,' ').trim()));
    }
    const text = out.filter(Boolean).join('\n');
    if (text.replace(/\s/g,'').length > 20) return text;
    throw new Error('This PDF has no readable text (it is probably a scanned image). Upload a photo or image of it instead so it can be read with text recognition.');
  }
  if (isImg){
    progress && progress('Loading text recognition (first time can take a moment)…');
    await loadScript(SCAN_LIBS.ocr);
    const r = await window.Tesseract.recognize(file, 'eng', {logger: m=>{ if (m.status==='recognizing text') progress && progress('Recognising text… '+Math.round(m.progress*100)+'%'); }});
    return r.data.text;
  }
  throw new Error('Smart scan reads PDF files and images (JPG, PNG).');
}
const MONTHS = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
function toISO(d){
  let m = d.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/); if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = d.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); if (m){ const y = m[3].length===2 ? '20'+m[3] : m[3]; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  m = d.match(/(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]{3,9})\.?,?\s+(\d{4})/); if (m && MONTHS[m[2].slice(0,4).toLowerCase()]||m&&MONTHS[m[2].slice(0,3).toLowerCase()]){ const mo = MONTHS[m[2].slice(0,4).toLowerCase()]||MONTHS[m[2].slice(0,3).toLowerCase()]; return `${m[3]}-${String(mo).padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  m = d.match(/([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})/); if (m && MONTHS[m[1].slice(0,3).toLowerCase()]) return `${m[3]}-${String(MONTHS[m[1].slice(0,3).toLowerCase()]).padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  return '';
}
const AMOUNT = /(?:[A-Z]{3}|US\$|\$|R)?\s?(\d{1,3}(?:[ ,]\d{3})*(?:\.\d{2})|\d+\.\d{2})\b/g;
const toNum = s => +String(s).replace(/[ ,]/g,'');
function parseDoc(text, suppliers, currencies){
  const lines = text.split(/\n/).map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean);
  const low = text.toLowerCase();
  const out = {supplier_id:'', supplier_text:'', reference:'', date:'', due_date:'', currency:'', total:0, lines:[], kind: /invoice|tax invoice/.test(low) ? 'invoice' : /receipt|till|cash sale/.test(low) ? 'receipt' : /quot|proforma|estimate/.test(low) ? 'quote' : 'document'};
  // supplier: best name match from the supplier list, else the first line with letters
  let best = null;
  suppliers.forEach(s=>{ const n=s.name.toLowerCase(); const words=n.split(/[^a-z0-9]+/).filter(w=>w.length>2); const hit = low.includes(n) ? 100 : words.filter(w=>low.includes(w)).length/Math.max(1,words.length)*80; if (hit>=60 && (!best||hit>best[1])) best=[s,hit]; });
  if (best){ out.supplier_id = best[0].id; out.supplier_text = best[0].name; } else out.supplier_text = (lines.find(l=>/[A-Za-z]{3}/.test(l) && !/invoice|quotation|receipt|tax|date|page/i.test(l))||'').slice(0,80);
  // reference number
  const refs = [...text.matchAll(/(?:invoice|inv|quotation|quote|receipt|ref(?:erence)?|document)[ \t]*(?:no\.?|number|num|#)?[ \t]*[:#\-]?[ \t]*([A-Z0-9][A-Z0-9\-\/]{2,})/gi)].map(m=>m[1]).filter(x=>/\d/.test(x));
  if (refs.length) out.reference = refs[0];
  // dates
  const dateRe = /(\d{4}[\/\-.]\d{1,2}[\/\-.]\d{1,2}|\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}|\d{1,2}(?:st|nd|rd|th)?\s+[A-Za-z]{3,9}\.?,?\s+\d{4}|[A-Za-z]{3,9}\.?\s+\d{1,2},?\s+\d{4})/g;
  const dueLine = lines.find(l=>/due|payable by|valid until|expiry/i.test(l) && dateRe.test(l)); dateRe.lastIndex=0;
  if (dueLine){ const m = dueLine.match(dateRe); if (m) out.due_date = toISO(m[m.length-1]); }
  const dateLine = lines.find(l=>/date/i.test(l) && !/due|valid/i.test(l) && dateRe.test(l)); dateRe.lastIndex=0;
  const allDates = (text.match(dateRe)||[]).map(toISO).filter(Boolean);
  out.date = dateLine ? toISO((dateLine.match(dateRe)||[''])[0]) : (allDates[0]||'');
  // currency
  const codes = currencies.map(c=>c.code);
  const cm = text.match(new RegExp('\\b('+codes.join('|')+')\\b')); out.currency = cm ? cm[1] : /US\$|\$/.test(text) ? 'USD' : /\bZ[WI]G\b/.test(text) ? 'ZWG' : '';
  // total: prefer "grand total / amount due / total due / balance due", then "total", else the largest amount
  const tl = [/grand total|amount due|total due|balance due|total payable|amount payable/i, /\btotal\b/i];
  for (const re of tl){ const cands = lines.filter(l=>re.test(l) && !/sub\s*-?total|vat|tax total/i.test(l)); for (const l of cands.reverse()){ const a=[...l.matchAll(AMOUNT)].map(x=>toNum(x[1])); if (a.length){ out.total = a[a.length-1]; break; } } if (out.total) break; }
  if (!out.total){ const a=[...text.matchAll(AMOUNT)].map(x=>toNum(x[1])); if (a.length) out.total = Math.max(...a); }
  // line items: "<description> <qty> <unit price> <amount>" with qty*unit ≈ amount
  lines.forEach(l=>{
    const m = l.match(/^(.*?[A-Za-z].*?)\s+(\d+(?:\.\d+)?)\s+(?:[A-Z]{3}\s?|\$)?(\d[\d ,]*\.\d{2})\s+(?:[A-Z]{3}\s?|\$)?(\d[\d ,]*\.\d{2})$/);
    if (m){ const q=+m[2], u=toNum(m[3]), amt=toNum(m[4]); if (q>0 && Math.abs(q*u-amt) <= Math.max(0.05, amt*0.01) && !/total|vat|tax/i.test(m[1])) out.lines.push({description:m[1].replace(/^\d+[.)]\s*/,'').trim(), qty:q, unit_price:u}); }
  });
  if (!out.lines.length && out.total) out.lines.push({description:(out.kind==='receipt'?'Purchase':'As per '+out.kind)+(out.supplier_text?' – '+out.supplier_text:''), qty:1, unit_price:out.total});
  return out;
}

Object.assign(App, {
  scan(kind){
    this._scan = {kind: kind||'requisition', file:null, data:null};
    M.open(`${M.head('Smart scan')}<div class="modal-b">
      <p class="muted" style="margin:0">Upload a quotation, invoice or receipt. Pera reads it in your browser and fills in the supplier, reference, dates, amounts and lines for you to check. Typed PDFs read best; photos are read with text recognition.</p>
      <div class="seg" role="tablist">${[['requisition','Requisition'],['expense','Expense'],['invoice','Supplier invoice']].map(([k,l])=>`<button class="${this._scan.kind===k?'on':''}" data-scankind="${k}">${l}</button>`).join('')}</div>
      <label class="drop" id="scan-drop" for="scan-file">Drop a PDF or photo here, or <u>browse</u><input id="scan-file" type="file" accept=".pdf,image/*,.txt"></label>
      <div id="scan-out"></div><div class="err" id="m-err" hidden></div></div>
      <div class="modal-f"><button class="btn ghost" data-close>Cancel</button><span class="grow"></span><button class="btn primary" id="scan-go" disabled data-act="scan-use">Continue</button></div>`);
    const run = async f => {
      this._scan.file = f; M.err('');
      const out = $('#scan-out'); out.innerHTML = `<div class="note">Reading ${esc(f.name)}…</div>`;
      try{
        const text = await extractText(f, msg=>{ out.innerHTML = `<div class="note">${esc(msg)}</div>`; });
        const d = parseDoc(text, Store.all('suppliers'), S().currencies||[]);
        this._scan.data = d; this._scan.text = text;
        out.innerHTML = this.scanReview(d, text); $('#scan-go').disabled = false;
      }catch(e){ console.error(e); out.innerHTML=''; M.err(e.message||String(e)); }
    };
    $('#scan-file').addEventListener('change', e=>{ const f=e.target.files[0]; if (f) run(f); });
    const drop = $('#scan-drop');
    ['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
    ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
    drop.addEventListener('drop', e=>{ const f=e.dataTransfer.files[0]; if (f) run(f); });
  },
  scanReview(d, text){
    const found = [d.supplier_id?'supplier':'', d.reference?'reference':'', d.date?'date':'', d.total?'total':'', d.lines.length&&d.lines[0].qty!==1?d.lines.length+' line(s)':''].filter(Boolean);
    return `<div class="note">Found ${found.length?found.join(', '):'very little'} — check and correct below.</div>
      <div class="grid-form">
        <label class="f">Supplier${selectHTML('id="sc-sup"', supOpts(), d.supplier_id, d.supplier_text?'Not matched: '+d.supplier_text:'Not matched')}</label>
        <label class="f">Reference / invoice no.<input id="sc-ref" type="text" value="${esc(d.reference)}"></label>
        <label class="f">Document date<input id="sc-date" type="date" value="${esc(d.date)}"></label>
        <label class="f">Due / valid until<input id="sc-due" type="date" value="${esc(d.due_date)}"></label>
        <label class="f">Currency${selectHTML('id="sc-cur"', (S().currencies||[]).map(c=>[c.code,c.code]), d.currency||baseCur())}</label>
        <label class="f">Total<input id="sc-total" type="number" step="0.01" value="${d.total||''}"></label>
      </div>
      ${d.lines.length?tableHTML([{h:'Description',v:l=>esc(l.description)},{h:'Qty',r:1,cls:'num',v:l=>l.qty},{h:'Unit price',r:1,cls:'num',v:l=>num(l.unit_price)},{h:'Amount',r:1,cls:'num',v:l=>num(l.qty*l.unit_price)}], d.lines):''}
      <details><summary class="faint">Text read from the document</summary><pre class="scan-text">${esc(text.slice(0,4000))}</pre></details>`;
  },
  scanUse(){
    const s = this._scan, d = s.data; if (!d) return;
    const vals = {}; ['sc-sup','sc-ref','sc-date','sc-due','sc-cur','sc-total'].forEach(id=>{ const el=$('#'+id); vals[id]= el ? (el.value||'').trim() : ''; });
    const v = id => vals[id]||'';
    const sup = v('sc-sup'), total = +v('sc-total')||d.total, cur = v('sc-cur')||baseCur();
    let lines = d.lines.length ? d.lines : [{description:'As per document', qty:1, unit_price:total}];
    if (total && Math.abs(linesTotal(lines)-total) > 0.05 && lines.length===1) lines = [{description:lines[0].description, qty:1, unit_price:total}];
    const note = 'Filled from '+s.file.name+' by Smart scan — check every field before submitting.';
    const cat = sup ? ((Store.sup(sup)||{}).category_ids||[])[0] : '';
    const budget = cat ? (Store.all('budgets').find(b=>b.category_id===cat&&b.active)||{}).id : '';
    M.close();
    if (s.kind==='invoice'){
      const pos = Store.all('purchase_orders').filter(p=>(!sup||p.supplier_id===sup) && ['issued','partially_received','received'].includes(p.status));
      if (!pos.length) return this.toast('No open purchase order'+(sup?' for '+Store.supName(sup):'')+' to match this invoice to. Raise or receive the PO first.');
      const open = p => { this.invForm(p, {supplier_invoice_no:v('sc-ref')||d.reference, amount:total, invoice_date:v('sc-date')||todayStr(), due_date:v('sc-due')||addDays(todayStr(),30)}); fileBins['fm-files'].push(s.file); fileBins['fm-files']._draw(); };
      if (pos.length===1) return open(pos[0]);
      this._scanPos = open;
      M.open(`${M.head('Which purchase order is this invoice for?')}<div class="modal-b"><div class="list">${pos.map(p=>`<button class="li" data-act="scan-po" data-id="${p.id}"><div class="t"><b class="mono">${esc(p.number)}</b><span>${esc(Store.supName(p.supplier_id))} · ${esc(p.lines.map(l=>l.description).join(', ').slice(0,80))}</span></div><span class="num">${fmtMoney(p.currency,p.total)}</span></button>`).join('')}</div></div>`, true);
      return;
    }
    const preset = {kind:s.kind==='expense'?'expense':'purchase', supplier_id:s.kind==='expense'?'':sup, payee:s.kind==='expense'?me().name:'', currency:cur, category_id:cat||'', budget_id:budget||'', lines,
      title:(s.kind==='expense'?(d.kind==='receipt'?'Receipt':'Expense'):'Purchase')+' – '+(sup?Store.supName(sup):(d.supplier_text||'scanned document')), description:(d.reference?'Supplier reference '+d.reference+'. ':'')+'Scanned from '+s.file.name+'.',
      due_date:v('sc-due')||addDays(todayStr(),14), expense_date:s.kind==='expense'?(v('sc-date')||todayStr()):'', _files:[s.file], _scanNote:note, _from:'Created with Smart scan from '+s.file.name};
    this.reqForm(null, preset);
  }
});

const MS_ICON = '<svg viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#F25022"/><rect x="11" y="1" width="9" height="9" fill="#7FBA00"/><rect x="1" y="11" width="9" height="9" fill="#00A4EF"/><rect x="11" y="11" width="9" height="9" fill="#FFB900"/></svg>';
function loginScreen(msg){
  applyBrand(); readDeepLink();            // keep an emailed approval link across sign-in (and the Microsoft redirect)
  const pw = CONFIG.PASSWORD_LOGIN !== false, ms = !!CONFIG.MICROSOFT_SSO;
  let out = ''; try{ out = sessionStorage.getItem('pera-out')||''; sessionStorage.removeItem('pera-out'); }catch(e){}
  const info = msg ? '' : out==='all' ? 'You have been signed out on all devices.' : out ? 'You have signed out. See you next time.' : '';
  $('#root').innerHTML = `<div class="login"><form class="panel" id="login-form" novalidate><div class="login-brand">${WORDMARK('by HeartPath Solutions')}<p class="tagline">Every payment, approved.</p></div><div class="panel-h"><h2 style="margin:0;font-size:16px">Sign in${brandInfo().client?' to '+esc(brandInfo().client):''}</h2></div>
    <div class="panel-b" style="display:flex;flex-direction:column;gap:12px">
    <div class="ok-msg" id="l-ok" role="status" ${info?'':'hidden'}>${esc(info)}</div>
    ${ms?`<button class="btn ms-btn" type="button" id="l-ms">${MS_ICON}<span>Sign in with Microsoft</span></button>${pw?'<div class="or-sep">or use your email and password</div>':''}`:''}
    ${pw?`<label class="f" for="l-email">Email<input id="l-email" type="email" autocomplete="username"></label>
      <label class="f" for="l-pass"><span class="lbl-row">Password<button type="button" class="link small" id="l-forgot">Forgot your password?</button></span><span class="pw-wrap"><input id="l-pass" type="password" autocomplete="current-password"><button type="button" class="btn sm ghost" id="l-show" aria-label="Show password">Show</button></span></label>`:''}
    <div class="err" id="l-err" role="alert" ${msg?'':'hidden'}>${esc(msg||'')}</div>${pw?`<button class="btn primary" type="submit" id="l-go" style="justify-content:center">Sign in</button>
      <div class="login-links"><span>New to Pera? <button type="button" class="link small" id="l-signup">Create your account</button></span><button type="button" class="link small" id="l-resend">Need the verification email sent again?</button></div>`:''}</div></form><p class="login-foot">© ${new Date().getFullYear()} HeartPath Solutions · Build. Automate. Transform.</p></div>`;
  const fail = m => { const el=$('#l-err'); el.hidden=false; el.textContent=m; $('#l-ok').hidden=true; };
  if (ms) $('#l-ms').addEventListener('click', async ()=>{
    const {error} = await Store.sb.auth.signInWithOAuth({provider:'azure', options:{scopes:'openid email profile offline_access', redirectTo: location.origin+location.pathname}});
    if (error) fail('Microsoft sign-in failed: '+error.message);
  });
  if (!pw){ $('#login-form').addEventListener('submit', e=>e.preventDefault()); return; }
  $('#l-show').addEventListener('click', e=>{ const i=$('#l-pass'), show=i.type==='password'; i.type=show?'text':'password'; e.target.textContent=show?'Hide':'Show'; e.target.setAttribute('aria-label',show?'Hide password':'Show password'); });
  $('#l-forgot').addEventListener('click', ()=>forgotScreen($('#l-email').value.trim()));
  $('#l-signup').addEventListener('click', ()=>signupScreen($('#l-email').value.trim()));
  $('#l-resend').addEventListener('click', ()=>signupScreen($('#l-email').value.trim(), true));
  $('#login-form').addEventListener('submit', async e=>{ e.preventDefault();
    const email=$('#l-email').value.trim(), pass=$('#l-pass').value;
    if (!email || !pass) return fail('Enter your email and password.');
    $('#l-go').disabled=true;
    const {error}=await Store.sb.auth.signInWithPassword({email,password:pass});
    if (error){ $('#l-go').disabled=false; return fail('Sign-in failed: '+error.message); }
    boot(); });
}
/* the reply is the same whether or not the email has an account, so the form can't be used to find out who works here */
function forgotScreen(email){
  $('#root').innerHTML = `<div class="login"><form class="panel" id="fp-form" novalidate><div class="login-brand">${WORDMARK('by HeartPath Solutions')}</div><div class="panel-h"><h2 style="margin:0;font-size:16px">Reset your password</h2></div>
    <div class="panel-b" style="display:flex;flex-direction:column;gap:12px"><p class="muted" style="margin:0">Enter the email you sign in with. We’ll send a link to choose a new password.</p>
    <label class="f" for="fp-email">Email<input id="fp-email" type="email" autocomplete="username" value="${esc(email||'')}"></label>
    <div class="ok-msg" id="fp-ok" role="status" hidden></div><div class="err" id="fp-err" role="alert" hidden></div>
    <button class="btn primary" type="submit" id="fp-go" style="justify-content:center">Send reset link</button><button class="link small" type="button" id="fp-back" style="align-self:center">Back to sign in</button></div></form></div>`;
  $('#fp-back').addEventListener('click', ()=>loginScreen());
  $('#fp-form').addEventListener('submit', async e=>{ e.preventDefault();
    const em = $('#fp-email').value.trim(), err=$('#fp-err');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ err.hidden=false; err.textContent='Enter a valid email address.'; return; }
    err.hidden=true; $('#fp-go').disabled=true;
    const {error} = await Store.sb.auth.resetPasswordForEmail(em, {redirectTo: location.origin+location.pathname});
    if (error && !/rate|limit/i.test(error.message||'')) console.warn(error);
    const ok=$('#fp-ok'); ok.hidden=false; ok.textContent = error && /rate|limit/i.test(error.message||'') ? 'Too many requests — wait a minute and try again.' : 'If '+em+' has a Pera account, a reset link is on its way. Check your inbox and spam folder.';
    $('#fp-go').disabled=false; });
}
/* people the administrator has added create their own login with the same work email; anyone else gets a login but no access */
function signupScreen(email, resendOnly){
  $('#root').innerHTML = `<div class="login"><form class="panel" id="su-form" novalidate><div class="login-brand">${WORDMARK('by HeartPath Solutions')}</div><div class="panel-h"><h2 style="margin:0;font-size:16px">${resendOnly?'Resend verification email':'Create your account'}</h2></div>
    <div class="panel-b" style="display:flex;flex-direction:column;gap:12px">
    <p class="muted" style="margin:0">${resendOnly?'Enter the email you signed up with and we’ll send the confirmation link again.':'Use the work email your administrator added to Pera. You’ll get an email to confirm it.'}</p>
    <label class="f" for="su-email">Work email<input id="su-email" type="email" autocomplete="username" value="${esc(email||'')}"></label>
    ${resendOnly?'':`<label class="f" for="su-pw1">Password<span class="pw-wrap"><input id="su-pw1" type="password" autocomplete="new-password"><button type="button" class="btn sm ghost" id="su-show">Show</button></span></label>
    <label class="f" for="su-pw2">Confirm password<input id="su-pw2" type="password" autocomplete="new-password"></label>
    <p class="faint" style="margin:0;font-size:12.5px">At least 10 characters with a letter and a number. Any symbols are allowed.</p>`}
    <div class="ok-msg" id="su-ok" role="status" hidden></div><div class="err" id="su-err" role="alert" hidden></div>
    <button class="btn primary" type="submit" id="su-go" style="justify-content:center">${resendOnly?'Resend email':'Create account'}</button>
    <button class="btn" type="button" id="su-again" hidden style="justify-content:center">Resend verification email</button>
    <button class="link small" type="button" id="su-back" style="align-self:center">Back to sign in</button></div></form></div>`;
  const fail = m => { const e=$('#su-err'); e.hidden=false; e.textContent=m; $('#su-ok').hidden=true; };
  const done = m => { const o=$('#su-ok'); o.hidden=false; o.textContent=m; $('#su-err').hidden=true; };
  const resend = async em => { const {error} = await Store.sb.auth.resend({type:'signup', email:em, options:{emailRedirectTo: location.origin+location.pathname}});
    if (error && /rate|limit/i.test(error.message||'')) return fail('Too many requests — wait a minute and try again.');
    done('If '+em+' is waiting for confirmation, a new link is on its way. Check your inbox and spam folder.'); };
  $('#su-back').addEventListener('click', ()=>loginScreen());
  if ($('#su-show')) $('#su-show').addEventListener('click', e=>{ const i=$('#su-pw1'), s=i.type==='password'; i.type=s?'text':'password'; e.target.textContent=s?'Hide':'Show'; });
  $('#su-again').addEventListener('click', ()=>resend($('#su-email').value.trim()));
  $('#su-form').addEventListener('submit', async e=>{ e.preventDefault();
    const em = $('#su-email').value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return fail('Enter a valid email address.');
    if (resendOnly) return resend(em);
    const a = $('#su-pw1').value, b = $('#su-pw2').value, bad = pwProblem(a, em);
    if (bad) return fail(bad); if (a!==b) return fail('The two passwords don’t match.');
    $('#su-go').disabled = true;
    const {data, error} = await Store.sb.auth.signUp({email:em, password:a, options:{emailRedirectTo: location.origin+location.pathname}});
    $('#su-go').disabled = false;
    if (error) return fail(/registered|exists/i.test(error.message||'') ? 'That email already has an account — sign in, or use Forgot your password.' : 'Could not create the account: '+error.message);
    if (data && data.session) return boot();
    done('Almost done — we sent a confirmation link to '+em+'. Open it to finish, then sign in.'); $('#su-again').hidden = false; });
}
async function boot(){
  try{ const ok = await Store.init(); if (!ok) return loginScreen(); await runSchedules(); App.view = RECOVERY ? 'profile' : Store.me.role==='supplier'?'portal':'dashboard'; if (RECOVERY) App.tab.prof='security'; else applyDeepLink(); App.render(); }
  catch(e){ console.error(e); if (LIVE) loginScreen(e.message||String(e)); else $('#root').innerHTML='<div class="empty">Could not start: '+esc(e.message||e)+'</div>'; }
}

else boot();
window.Pera = {App, Store};
