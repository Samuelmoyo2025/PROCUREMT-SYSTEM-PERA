<html lang="en">
<head>
<meta charset="utf-8">
<title>Pera · Procure-to-pay by HeartPath Solutions</title>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Open+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap">
<style>
/* Pera palette, after Coupa: navy #081D4D, Coupa blue #1565C0, sky #5FD6FF */
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --surface-2:#F6F8FC; --ink:#081D4D; --ink-2:#4A5A7A; --ink-3:#7A89A6;
  --line:#D6DEEB; --accent:#5FD6FF; --accent-2:#2EC4F1; --accent-ink:#081D4D; --accent-soft:#E3F7FF;
  --link:#1565C0; --link-soft:#E6F0FB;
  --side:#081D4D; --side-2:#0F2E66; --side-ink:#D6E2F5; --side-ink-2:#8FA6CC;
  --amber:#8D6605; --amber-bg:#FFF7E3; --red:#C81E1E; --red-bg:#FDECEC; --blue:#1565C0; --blue-bg:#E6F0FB;
  --grey:#4A5A7A; --grey-bg:#EBEFF6; --green:#0A7A2F; --green-bg:#E6F6EA;
  --shadow:0 1px 1px rgba(8,29,77,.08),0 4px 16px rgba(8,29,77,.08);
  --sans:"Open Sans","Helvetica Neue",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --display:"Poppins","Open Sans",Arial,sans-serif;
}
h1,h2,.brand b,.wordmark b,.panel-h h2,.dash-tabs button{font-family:var(--display)}
.brand b{font-weight:600;letter-spacing:.01em}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#061636; --surface:#0C2250; --surface-2:#10295C; --ink:#E8EEF8; --ink-2:#B5C3DD; --ink-3:#8C9CBD;
    --line:#23396B; --accent:#5FD6FF; --accent-2:#8FE3FF; --accent-ink:#081D4D; --accent-soft:#0E3561;
    --link:#6FB1F5; --link-soft:#0E2E5C;
    --side:#04102E; --side-2:#0C2250; --side-ink:#D6E2F5; --side-ink-2:#8C9CBD;
    --amber:#FFD27A; --amber-bg:#3A2D0A; --red:#FF8A8A; --red-bg:#3F1616; --blue:#89BDEE; --blue-bg:#0E2E5C;
    --grey:#B5C3DD; --grey-bg:#1A3366; --green:#6FD478; --green-bg:#133018;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#061636; --surface:#0C2250; --surface-2:#10295C; --ink:#E8EEF8; --ink-2:#B5C3DD; --ink-3:#8C9CBD;
  --line:#23396B; --accent:#5FD6FF; --accent-2:#8FE3FF; --accent-ink:#081D4D; --accent-soft:#0E3561;
  --link:#6FB1F5; --link-soft:#0E2E5C;
  --side:#04102E; --side-2:#0C2250; --side-ink:#D6E2F5; --side-ink-2:#8C9CBD;
  --amber:#FFD27A; --amber-bg:#3A2D0A; --red:#FF8A8A; --red-bg:#3F1616; --blue:#89BDEE; --blue-bg:#0E2E5C;
  --grey:#B5C3DD; --grey-bg:#1A3366; --green:#6FD478; --green-bg:#133018;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
a{color:var(--link)}
.link{all:unset;cursor:pointer;color:var(--link);font-weight:600}
.link:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:2px;padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;color:#fff;font-size:17px;font-weight:800;letter-spacing:-.01em}
.brand b span,.wordmark b span{background:linear-gradient(90deg,var(--link),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.side-foot .vendor{display:block;margin-top:4px;letter-spacing:.14em;text-transform:uppercase;font-size:9.5px;opacity:.8}
.wordmark{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.wordmark svg{width:64px;height:68px}
.wordmark b{display:block;font-size:32px;font-weight:800;letter-spacing:-.02em;color:var(--ink);line-height:1.1}
.wordmark small{display:block;letter-spacing:.06em;font-size:12.5px;color:var(--ink-2);margin-top:4px}
.login{background:radial-gradient(900px 520px at 85% 0%,rgba(95,214,255,.22),transparent 60%),linear-gradient(135deg,#081D4D 0%,#0B2D66 55%,#1565C0 100%)}
.login .login-foot{color:#C9D8F2}
.login>div,.login{align-content:center}
.login-brand{padding:22px 16px 6px}
.tagline{margin:10px 0 0;text-align:center;font-weight:600;font-size:13.5px;background:linear-gradient(90deg,var(--link),#12C6F3);-webkit-background-clip:text;background-clip:text;color:transparent}
.login-foot{text-align:center;color:var(--ink-2);font-size:12px;margin:14px 0 0}
.client-logo{display:block;max-height:44px;max-width:170px;object-fit:contain}
.brand .client-logo{max-height:34px;max-width:120px;background:#fff;border-radius:6px;padding:3px}
.wordmark .client-logo{max-height:56px;max-width:220px;margin-bottom:4px}
.ms-btn{justify-content:center;gap:10px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:600}
.ms-btn:hover{background:var(--surface-2)}
.ms-btn svg{width:18px;height:18px}
.or-sep{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:12px}.or-sep:before,.or-sep:after{content:'';flex:1;border-top:1px solid var(--line)}
.brand-prev{display:flex;align-items:center;gap:12px;padding:10px;border:1px dashed var(--line);border-radius:8px}
.brand small{color:var(--side-ink-2);font-size:11px;letter-spacing:.04em;display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-ink-2);padding:12px 10px 3px;font-weight:700}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--side-ink)}
.nav button:hover{background:var(--side-2)}
.nav button.on{background:var(--side-2);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.nav button:focus-visible{outline:2px solid #FF9900}
.nav svg{width:17px;height:17px;flex:none;opacity:.9}
.nav .count{margin-left:auto;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;border-radius:10px;padding:0 7px;line-height:18px}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--side-2);font-size:12px;color:var(--side-ink-2)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px}
.top .grow{flex:1}
.top .menu-btn{display:none}
.demo-chip{font-size:11.5px;background:var(--accent-soft);color:var(--ink);border:1px solid var(--accent);border-radius:999px;padding:1px 10px;font-weight:600;white-space:nowrap}
.who{display:flex;align-items:center;gap:8px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--side);color:#fff;display:grid;place-items:center;font-weight:700;font-size:11.5px;flex:none}
.who select{max-width:250px}
.bell{position:relative}
.bell .dot{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:0 5px;line-height:16px}

.page{padding:24px;display:flex;flex-direction:column;gap:20px;max-width:1360px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:800;letter-spacing:-.015em}
.page-head p{margin:4px 0 0;color:var(--ink-2);max-width:75ch}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.crumb{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);margin:0 0 4px}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ink-3);background:var(--surface);border-radius:20px;padding:6px 16px;cursor:pointer;font-weight:700;white-space:nowrap;color:var(--link);border-color:var(--link);text-decoration:none}
.btn:hover{background:var(--link-soft)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{background:var(--surface);border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:var(--red-bg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:3px 11px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=datetime-local],input[type=password],input:not([type]),select,textarea{border:1px solid var(--ink-3);background:var(--surface);border-radius:8px;padding:6px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--link);outline-offset:-1px;border-color:transparent}
label.f{display:flex;flex-wrap:wrap;align-content:flex-start;gap:5px 4px;font-size:12.5px;font-weight:700;color:var(--ink)}
label.f>input,label.f>select,label.f>textarea,label.f>.checks{flex-basis:100%;font-weight:400;font-size:14px;color:var(--ink)}
label.f .req{color:var(--red)}
label.f .help{flex-basis:100%;font-weight:400;color:var(--ink-3);font-size:12px}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-height:180px;overflow:auto}
.filters input,.filters select,.lines input,.lines select{font-weight:400}
.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.span-2{grid-column:span 2} .span-all{grid-column:1/-1}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink-2);cursor:pointer;font-weight:400}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 1px rgba(0,28,36,.05)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{font-size:16px;font-weight:700}
.panel-b{padding:16px 18px}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.stat:hover{border-color:var(--link)}
.stat .k{font-size:12px;color:var(--ink-2);font-weight:700}
.stat .v{font-size:30px;font-weight:700;font-family:var(--mono);letter-spacing:-.03em;color:var(--link)}
.stat .s{font-size:12.5px;color:var(--ink-2)}
.stat.hot{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.banner{border-radius:10px;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid transparent}
.banner.amber{background:var(--amber-bg);color:var(--amber);border-color:var(--amber)}
.banner.red{background:var(--red-bg);color:var(--red);border-color:var(--red)}
.banner.blue{background:var(--blue-bg);color:var(--blue);border-color:var(--blue)}
.banner.green{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.banner .grow{flex:1;min-width:200px}
.banner .btn:not(.primary){background:var(--surface)}

/* tabs & filters */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;white-space:nowrap;color:var(--ink-2);border-bottom:3px solid transparent;font-weight:700}
.tabs button.on{color:var(--link);border-bottom-color:var(--link)}
.tabs button:focus-visible{outline:2px solid var(--link)}
.tabs .n{font-family:var(--mono);font-size:12px;margin-left:5px;color:var(--ink-3);font-weight:500}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.filters input,.filters select{width:auto}
.filters .search{flex:1 1 220px}

/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:12.5px;color:var(--ink-2);font-weight:700;text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
td.mono,td.num,td.nw{white-space:nowrap}
td.name{font-weight:600;max-width:360px}
td.name small{display:block;font-weight:400;color:var(--ink-2)}
tfoot td{font-weight:700;background:var(--surface-2)}
.empty{padding:36px 18px;text-align:center;color:var(--ink-2)}
.tfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
tr.best td{background:var(--green-bg)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-grey{background:var(--grey-bg);color:var(--grey)}
.t-amber{background:var(--amber-bg);color:var(--amber)}
.t-blue{background:var(--blue-bg);color:var(--blue)}
.t-red{background:var(--red-bg);color:var(--red)}
.t-green{background:var(--green-bg);color:var(--green)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:11.5px;color:var(--ink-2);margin:1px 3px 1px 0;white-space:nowrap}
.over{color:var(--red);font-weight:700}
.votes{display:inline-flex;gap:3px;vertical-align:middle}
.votes i{width:10px;height:10px;border-radius:3px;background:var(--grey-bg);border:1px solid var(--ink-3)}
.votes i.a{background:var(--green);border-color:var(--green)}
.votes i.r{background:var(--red);border-color:var(--red)}
.stars{color:var(--accent-2);letter-spacing:1px;white-space:nowrap}

/* dashboard */
.dash{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 18px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface-2)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t span{font-size:12.5px;color:var(--ink-2)}
.bars{display:flex;flex-direction:column;gap:11px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:13px}
.bar-row .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;position:relative}
.bar-row .fill{height:100%;background:var(--link);border-radius:0 4px 4px 0}
.bar-row .fill.c{background:var(--accent)}
.bar-row .fill.warn{background:var(--red)}
.meter{display:flex;height:100%}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);align-items:end;gap:6px;height:180px;padding-top:8px}
.cols .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--ink-3)}
.cols .c i{display:block;width:70%;max-width:34px;background:var(--link);border-radius:4px 4px 0 0;min-height:2px}
.cols .c:hover i{background:var(--accent-2)}
.cols .c b{font:500 10.5px var(--mono);color:var(--ink-2)}
.feed{display:flex;flex-direction:column}
.feed .ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);font-size:13px}
.feed .ev:last-child{border-bottom:0}
.ev .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.ev time{display:block;font-size:11.5px;color:var(--ink-3)}

/* flow strip */
.flow{display:flex;gap:0;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.flow .st{flex:1 1 0;min-width:120px;padding:10px 14px;border-right:1px solid var(--line);font-size:12.5px;position:relative}
.flow .st:last-child{border-right:0}
.flow .st b{display:block;font-size:13px}
.flow .st span{color:var(--ink-3)}
.flow .st.done b{color:var(--green)} .flow .st.done{box-shadow:inset 0 3px 0 var(--green)}
.flow .st.now{box-shadow:inset 0 3px 0 var(--accent);background:var(--accent-soft)}
.flow .st.skip{opacity:.55}

/* detail */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px 20px}
.kv div span{display:block;font-size:12px;color:var(--ink-2);font-weight:700}
.kv div b{font-weight:500}
.total-line{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;border-top:2px solid var(--ink);font-weight:700}
.total-line .num{font-size:18px}
.files{display:flex;flex-direction:column;gap:8px}
.file{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.file .ft{width:36px;height:36px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font:600 10px var(--mono);color:var(--ink-2);flex:none}
.file .fn{flex:1;min-width:0}
.file .fn b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .fn span{font-size:12px;color:var(--ink-2)}
.approver{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.approver:last-child{border-bottom:0}
.approver .t{flex:1;min-width:0}
.approver .t b{display:block}
.approver .t span{font-size:12.5px;color:var(--ink-2)}

/* forms */

.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login .panel{width:min(400px,100%)}

/* printable purchase order */
.po-doc{background:#fff;color:#16191F;border:1px solid var(--line);border-radius:10px;padding:28px;display:flex;flex-direction:column;gap:18px}

@media print{

  .app{display:block} body{background:#fff}
  .po-doc{border:0;padding:0}
}

function applyBrand(){
  const st = document.documentElement.style, c = (brandInfo().color||'').trim();
  const props = ['--accent','--accent-2','--accent-soft','--accent-ink'];
  if (!/^#[0-9a-f]{6}$/i.test(c)){ props.forEach(p=>st.removeProperty(p)); return; }

/* ---------- demo file storage (IndexedDB with memory fallback) ---------- */
const memFiles = new Map();
let idb = null;
function openIDB(){
  return new Promise(res=>{
    // Some locked-down browsers never answer indexedDB.open; fall back to memory after 1.5 s instead of hanging.
    const t = setTimeout(res, 1500);
    const done = ()=>{ clearTimeout(t); res(); };
    try{
      const r = indexedDB.open('pera-files',1);
      r.onupgradeneeded = ()=> r.result.createObjectStore('files');
      r.onsuccess = ()=>{ idb = r.result; done(); };
      r.onerror = done;
      r.onblocked = done;
    }catch(e){ done(); }
  });
}
async function sha256Of(blob){
  try{ if (!(window.crypto && crypto.subtle)) return ''; const h = await crypto.subtle.digest('SHA-256', await blob.arrayBuffer()); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join(''); }
  catch(e){ return ''; }
}
function idbPut(key,blob){
  memFiles.set(key,blob);
  return new Promise(res=>{
    if(!idb) return res();
    const t = setTimeout(res, 1500);                       // never let a stalled browser store block the app
    const done = ()=>{ clearTimeout(t); res(); };
    try{ const tx = idb.transaction('files','readwrite'); tx.objectStore('files').put(blob,key); tx.oncomplete=done; tx.onerror=done; tx.onabort=done; }catch(e){ done(); }
  });
}
function idbGet(key){
  if(memFiles.has(key)) return Promise.resolve(memFiles.get(key));
  return new Promise(res=>{
    if(!idb) return res(null);
    const t = setTimeout(()=>res(null), 1500);
    try{ const r = idb.transaction('files').objectStore('files').get(key); r.onsuccess=()=>{ clearTimeout(t); res(r.result||null); }; r.onerror=()=>{ clearTimeout(t); res(null); }; }catch(e){ clearTimeout(t); res(null); }
  });
}
function makePdf(title, lines){
  const safe = s => String(s).replace(/[^\x20-\x7E]/g,'-').replace(/([()\\])/g,'\\$1');
  const body = ['BT /F2 16 Tf 50 790 Td ('+safe(title)+') Tj ET','BT /F1 11 Tf 50 760 Td 16 TL'].concat(lines.map(l=>'('+safe(l)+') Tj T*')).concat(['ET']).join('\n');
  const objs = ['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 4 0 R >>',
    '<< /Length '+body.length+' >>\nstream\n'+body+'\nendstream','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>'];
  let out = '%PDF-1.4\n'; const offs = [];
  objs.forEach((o,i)=>{ offs.push(out.length); out += (i+1)+' 0 obj\n'+o+'\nendobj\n'; });
  const x = out.length;
  out += 'xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
  out += 'trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+x+'\n%%EOF';
  return new Blob([out],{type:'application/pdf'});
}

const rateOf = cur => { const c=(S().currencies||[]).find(c=>c.code===cur); return c && +c.rate ? +c.rate : 1; };
const toBase = (cur,v) => (+v||0)/rateOf(cur);
function pickTier(currency, total){
  const base = toBase(currency,total);
  const tiers = (S().approval_tiers||[]).slice().sort((a,b)=>(a.max==null?Infinity:+a.max)-(b.max==null?Infinity:+b.max));
  return tiers.find(t=>t.max==null || t.max==='' || base<=+t.max) || tiers[tiers.length-1] || {label:'Default',approver_ids:[],required:1};
}
/* approval steps: a record either has `stages` (step 1, then step 2…, each "any N of these people")

function stagesOf(r){
  if (r.stages && r.stages.length) return r.stages;
  const ids = r.approver_ids||[];

}
function stageVotes(r, i){
  const s = stagesOf(r)[i], v = (r.approvals||[]).filter(a=>(a.stage||0)===i && s.ids.includes(a.approver_id));
  return {s, yes:v.filter(a=>a.decision==='approved').length, no:v.filter(a=>a.decision==='rejected').length, needed:Math.min(+s.required||s.ids.length, s.ids.length)};
}
/* index of the step now waiting for decisions, or -1 once every step is complete */
function currentStage(r){ const st = stagesOf(r); for (let i=0;i<st.length;i++){ const v=stageVotes(r,i); if (v.yes < v.needed) return i; } return -1; }
function outcome(req){
  const st = stagesOf(req);
  if (!st.length || !st[0].ids.length) return 'pending';
  const veto = (S().reject_rule||'veto')==='veto';
  for (let i=0;i<st.length;i++){ const v=stageVotes(req,i); if ((veto && v.no>0) || v.no > v.s.ids.length - v.needed) return 'rejected'; }
  return currentStage(req)===-1 ? 'approved' : 'pending';
}
/* the approval route a requisition gets on submission: the tier's first step, then any further steps; the requester is never in it */
function routeFor(tier, creator){
  const raw = [{label:tier.step_label||'Approval', approver_ids:tier.approver_ids||[], required:tier.required}].concat(tier.next_steps||[]);
  const stages = raw.map(s=>{ const ids=(s.approver_ids||[]).filter(a=>a!==creator); return {label:s.label||'Approval', ids, required:Math.min(Math.max(1,+s.required||1), ids.length)}; }).filter(s=>s.ids.length);
  return {stages, multi:(tier.next_steps||[]).length>0, ids:[...new Set(stages.flatMap(s=>s.ids))], required:sum(stages,s=>s.required)};
}
const linesTotal = lines => round2(sum(lines||[], l=>(+l.qty||0)*(+l.unit_price||0)));
const usersWhere = f => Store.all('app_users').filter(u=>u.active && f(u)).map(u=>u.id);
const FLOW = {
  requisitions:{ type:r=>r.kind==='expense'?'expense':'requisition', approved:()=>S().review_enabled?'review':'approved', released:()=>'approved' },
  purchase_orders:{ type:()=>'po', approved:()=>S().review_enabled?'review':'issued', released:()=>'issued' },
  contracts:{ type:()=>'contract', approved:()=>'active', released:()=>'active' }
};
async function afterApproval(table, rec){
  const type = FLOW[table].type(rec);
  if (rec.status==='review'){
    await Store.log(type, rec, 'Fully approved', 'Sent to Finance for review before release');
    await Store.notify(usersWhere(u=>u.role==='finance'), type, rec, rec.number+' is approved and needs your review before release');
    await Store.notify([rec.created_by], type, rec, rec.number+' is fully approved — waiting for Finance review');
    return;
  }
  await Store.log(type, rec, 'Fully approved', '');
  await afterRelease(table, rec);
}
async function afterRelease(table, rec){
  const type = FLOW[table].type(rec);
  if (table==='requisitions'){
    const direct = rec.kind!=='purchase';
    await Store.log(type, rec, 'Released', direct?'Released to Finance for payment':'Released to Procurement to source and raise a purchase order');
    await Store.notify([rec.created_by, ...usersWhere(u=>direct?u.role==='finance':u.role==='procurement')], type, rec, rec.number+(direct?' is approved and ready for payment':' is approved — ready for sourcing / PO'));
  } else if (table==='purchase_orders'){
    await Store.log('po', rec, 'Purchase order issued', Store.supName(rec.supplier_id)+' · '+fmtMoney(rec.currency,rec.total));
    const r = Store.byId('requisitions', rec.req_id);
    if (r) await Store.log('requisition', r, 'Purchase order issued', rec.number+' to '+Store.supName(rec.supplier_id));
    await Store.notify([rec.created_by, r&&r.created_by, ...usersWhere(u=>u.role==='supplier'&&u.supplier_id===rec.supplier_id)], 'po', rec, 'Purchase order '+rec.number+' issued to '+Store.supName(rec.supplier_id));
  } else if (table==='contracts'){
    await Store.notify([rec.created_by], 'contract', rec, rec.number+' – '+rec.title+' is approved and active');
  }
}

  supName(id){ const s=this.sup(id); return s? s.name : '—'; },

  async insert(t,obj){
    if (LIVE){ const {data,error}=await this.sb.from(t).insert(obj).select().single(); if(error) throw error; this.data[t].push(data); return data; }
    this.data[t].push(obj); this.persist(); return obj;
  },
  async update(t,id,patch){
    if (TOUCH.includes(t) && !('updated_at' in patch)) patch = Object.assign({}, patch, {updated_at:nowISO()});
    if (LIVE){ const {data,error}=await this.sb.from(t).update(patch).eq('id',id).select().single(); if(error) throw error; const i=this.data[t].findIndex(x=>x.id===id); if(i>-1) this.data[t][i]=data; return data; }
    const o=this.byId(t,id); Object.assign(o,patch); this.persist(); return o;
  },
  async saveSettings(patch){
    const next = Object.assign({}, this.settings, patch);
    if (LIVE){ const {error}=await this.sb.from('settings').update({value:next}).eq('id',1); if(error) throw error; }
    this.settings = next; this.persist();
  },
  async log(type, ent, action, details){
    const row = {id:uid(), entity_type:type, entity_id:ent?ent.id:null, entity_number:ent?(ent.number||ent.name||null):null, action, details:details||'', user_id:this.me.id, user_name:this.me.name, at:nowISO()};
    if (LIVE){ const {error}=await this.sb.from('audit_log').insert(row); if(!error) this.data.audit_log.push(row); else console.warn(error); return; }
    this.data.audit_log.push(row); this.persist();
  },
  async notify(userIds, type, ent, message){
    for (const u of [...new Set(userIds)].filter(Boolean)){
      const row = {id:uid(), user_id:u, entity_type:type, entity_id:ent.id, message, read:false, at:nowISO()};
      if (LIVE){ const {error}=await this.sb.from('notifications').insert(row); if(error) console.warn(error); }
      else this.data.notifications.push(row);
    }
    this.persist();
  },
  nextNumber(t, prefix){
    const n = this.all(t).filter(r=>String(r.number||'').startsWith(prefix)).reduce((m,r)=>Math.max(m, parseInt(String(r.number).slice(prefix.length))||0),0)+1;
    return prefix+String(n).padStart(5,'0');
  },
  async remove(t,id){
    if (LIVE){ const {error}=await this.sb.from(t).delete().eq('id',id); if(error) throw error; }
    this.data[t] = this.all(t).filter(x=>x.id!==id); this.persist();
  },
  async putFile(file, folder, kind){
    const path = folder+'/'+uid().slice(0,8)+'-'+file.name.replace(/[^\w.\-]+/g,'_');
    if (LIVE){ const {error}=await this.sb.storage.from(CONFIG.STORAGE_BUCKET).upload(path,file,{contentType:file.type||'application/octet-stream',upsert:false}); if(error) throw error; }
    else await idbPut(path,file);
    return {id:uid(), path, name:file.name, size:file.size, type:file.type||'', kind:kind||'support', sha256: await sha256Of(file), uploaded_by:this.me.id, uploaded_by_name:this.me.name, at:nowISO()};
  },
  async fileUrl(att){
    if (LIVE){ const {data,error}=await this.sb.storage.from(CONFIG.STORAGE_BUCKET).createSignedUrl(att.path,3600); if(error) throw error; return data.signedUrl; }
    const b = await idbGet(att.path); return b ? URL.createObjectURL(b) : null;
  },
  /* generic approve / reject for requisitions & expenses, purchase orders and contracts */
  async decide(table, rec, decision, comment){
    const F = FLOW[table];
    if (LIVE){
      const {error}=await this.sb.rpc('decide_record',{p_table:table,p_id:rec.id,p_decision:decision,p_comment:comment||''});
      if (error) throw error;
      await this.reloadTables([table,'audit_log','notifications']);
      return this.byId(table,rec.id);
    }
    if (rec.created_by===this.me.id) throw new Error('You cannot approve or reject your own request');
    const principal = actingFor(this.me, rec);
    if (!principal) throw new Error('You are not an approver on this record');
    const p = this.user(principal), onBehalf = principal!==this.me.id, cur = currentStage(rec);
    const approvals = (rec.approvals||[]).concat([Object.assign({approver_id:principal, approver_name:p.name, decision, comment:comment||'', at:nowISO(), stage:Math.max(0,cur)}, onBehalf?{by_id:this.me.id, by_name:this.me.name}:{})]);
    const res = outcome(Object.assign({},rec,{approvals}));
    const status = res==='approved' ? F.approved(rec) : res==='rejected' ? 'rejected' : rec.status;
    const patch = {approvals, status}; if (res!=='pending') patch.decided_at = nowISO();
    await this.update(table, rec.id, patch);
    const type = F.type(rec), label = rec.number+' – '+(rec.title||Store.supName(rec.supplier_id));
    await this.log(type, rec, (decision==='approved'?'Approved':'Rejected')+(onBehalf?' on behalf of '+p.name:''), comment?'“'+comment+'”':'');
    await this.notify([rec.created_by], type, rec, this.me.name+' '+decision+' '+label);
    if (res==='pending' && rec.stages && rec.stages.length){
      const nr = this.byId(table,rec.id), next = currentStage(nr);
      if (next > cur){ const s = stagesOf(nr)[next];
        await this.log(type, nr, 'Step '+(cur+1)+' approved', 'Sent to step '+(next+1)+' – '+s.label+': '+s.ids.map(a=>this.user(a).name).join(', '));
        await this.notify(withDelegates(s.ids), type, nr, label+' ('+fmtMoney(rec.currency,rec.total)+') needs your approval – step '+(next+1)+' of '+stagesOf(nr).length); }
    }
    if (res==='approved') await afterApproval(table, this.byId(table,rec.id));
    else if (res==='rejected'){
      await this.log(type, rec, 'Rejected (final)', 'Rejected by '+this.me.name);
      await this.notify((rec.approver_ids||[]).filter(a=>a!==this.me.id), type, rec, rec.number+' was rejected — no further action needed');
    }
    return this.byId(table,rec.id);
  },
  /* finance review step after approval */
  async review(table, rec, ok, note){
    if (LIVE){
      const {error}=await this.sb.rpc('review_record',{p_table:table,p_id:rec.id,p_ok:ok,p_note:note||''});
      if (error) throw error;
      await this.reloadTables([table,'audit_log','notifications']);
      return this.byId(table,rec.id);
    }
    const F = FLOW[table], type = F.type(rec);
    const status = ok ? F.released(rec) : 'rejected';
    await this.update(table, rec.id, {status, reviewed_by:this.me.id, reviewed_by_name:this.me.name, reviewed_at:nowISO(), review_note:note||''});
    await this.log(type, rec, ok?'Reviewed and released':'Returned by review', note||'');
    const r2 = this.byId(table, rec.id);
    if (ok) await afterRelease(table, r2);
    else await this.notify([rec.created_by], type, rec, rec.number+' was returned by '+this.me.name+' at review: '+(note||''));
    return r2;
  },

  /* ----- live mode ----- */
  async initLive(){
    this.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    const {data:{session}} = await this.sb.auth.getSession();
    if (!session) return false;
    await this.reloadAll(session.user.email);
    if (!this.me){ try{ const {data:added}=await this.sb.rpc('provision_me'); if (added) await this.reloadAll(session.user.email); }catch(e){ console.warn(e); } }
    try{ const {data:made}=await this.sb.rpc('run_schedules'); if (made) await this.reloadTables(['requests','notifications']); }catch(e){ console.warn(e); }
    if (!this.me){ await this.sb.auth.signOut(); throw new Error('Your login ('+session.user.email+') is not set up as a Pera user. Ask an administrator to add you under Settings → Users.'); }
    this.sb.channel('pera').on('postgres_changes',{event:'*',schema:'public'},()=>{ clearTimeout(this._t); this._t=setTimeout(async()=>{ await this.reloadAll(); App.render(); },500); }).subscribe();
    return true;
  },
  async reloadTables(list){
    for (const t of list){ const {data,error}=await this.sb.from(t).select('*').limit(20000); if(error) throw error; this.data[t]=data||[]; }
  },
  async reloadAll(email){
    await this.reloadTables(TABLES);
    const {data}=await this.sb.from('settings').select('value').eq('id',1).single();
    this.settings=(data&&data.value)||{};
    const em=(email||(this.me&&this.me.email)||'').toLowerCase();
    this.me=this.data.app_users.find(u=>(u.email||'').toLowerCase()===em && u.active);
  },

    const each = async a => { if (a && a.sample && !(await idbGet(a.path))) await idbPut(a.path, makePdf(a.sample.title, a.sample.lines)); };
    for (const t of ['requisitions','rfqs','bids','receipts','invoices','contracts','requests']) for (const r of this.all(t)) for (const a of (r.attachments||[])) await each(a);
    for (const s of this.all('suppliers')) for (const d of (s.documents||[])) await each(d.file);
  }
};

  return bids.map(b=>{ const price=(+c.price||0)*minP/(+b.amount||Infinity), delivery=(+c.delivery||0)*minD/(+b.delivery_days||1), tech=(+c.technical||0)*(+b.technical_score||0)/100; return {b, price, delivery, tech, total:price+delivery+tech}; }).sort((a,b)=>b.total-a.total);
}

function applyFilters(rows, key, o){
  const f = App.f[key]||{};
  const q = (f.q||'').trim().toLowerCase();
  if (q) rows = rows.filter(r=>o.text(r).toLowerCase().includes(q));
  const dt = o.date || (r=>(r.created_at||'').slice(0,10));
  if (f.from) rows = rows.filter(r=>(dt(r)||'')>=f.from);
  if (f.to) rows = rows.filter(r=>(dt(r)||'')<=f.to);
  if (o.amount){ if (f.min!==undefined && f.min!=='') rows = rows.filter(r=>o.amount(r)>=+f.min); if (f.max!==undefined && f.max!=='') rows = rows.filter(r=>o.amount(r)<=+f.max); }

  (o.more||[]).forEach(m=>{ if (f[m.k]) rows = rows.filter(r=>String(m.get(r))===String(f[m.k])); });
  return rows;
}

  dueItems(){
    const u = me(), out = [];
    reqsVisible().filter(r=>['pending','review','approved'].includes(r.status) && r.due_date).forEach(r=>out.push({date:r.due_date, kind:r.kind==='expense'?'Expense':'Requisition', title:r.title, number:r.number, ref:(r.kind==='expense'?'expense':'requisition')+':'+r.id}));
    if (can.seeAll(u)){
      Store.all('purchase_orders').filter(p=>inBranch(p)&&['issued','partially_received'].includes(p.status)&&p.delivery_date).forEach(p=>out.push({date:p.delivery_date, kind:'Delivery', title:Store.supName(p.supplier_id), number:p.number, ref:'po:'+p.id}));
      Store.all('invoices').filter(v=>v.status!=='paid'&&v.due_date).forEach(v=>out.push({date:v.due_date, kind:'Invoice', title:Store.supName(v.supplier_id), number:v.number, ref:'invoice:'+v.id}));
      Store.all('contracts').filter(c=>c.status==='active'&&c.end_date>=todayStr()).forEach(c=>out.push({date:c.end_date, kind:'Contract ends', title:c.title, number:c.number, ref:'contract:'+c.id}));
    }
    Store.all('requests').filter(r=>inBranch(r)&&['pending','open'].includes(r.status)&&r.needed_by&&(can.seeAll(u)||r.created_by===u.id)).forEach(r=>out.push({date:r.needed_by, kind:'Request', title:r.title, number:r.number, ref:'request:'+r.id}));
    return out;
  },

  messagesPage(){
    const threads = this.myThreads();
    const sel = this.msgSel && threads.find(t=>t.id===this.msgSel) ? this.msgSel : (threads[0]||{}).id;
    const t = threads.find(x=>x.id===sel);
    const rec = t && entityOf(t.type, t.id);
    // mark as seen
    if (me().msg_seen_at !== nowISO().slice(0,16)){ Store.me.msg_seen_at = nowISO(); Store.persist(); }
    const TL = {requisition:'Requisition',expense:'Expense',po:'Purchase order',contract:'Contract',request:'Request',rfq:'RFQ'};
    return `${pageHead('Messages','Conversations about requisitions, expenses, orders, contracts and requests. Type @ and a first name to notify someone.')}
      <div class="msg-wrap panel">
        <div class="msg-list">${threads.length?threads.map(x=>`<button class="li ${x.id===sel?'sel':''}" data-msg="${x.id}"><div class="avatar">${esc(initials(x.last.user_name))}</div><div class="t"><b>${esc(TL[x.type]||x.type)} <span class="mono">${esc(x.number||'')}</span></b><span>${esc(x.last.user_name)}: ${esc(x.last.body.slice(0,70))}</span></div><span class="faint" style="font-size:11.5px;white-space:nowrap">${fmtDate(x.last.at)}</span></button>`).join(''):'<div class="empty">No conversations yet. Open any requisition, order or contract and post a comment.</div>'}</div>

  /* ---------------- help center ---------------- */
  helpPage(){
    const q = ((this.f.help||{}).q||'').toLowerCase();
    const sup = S().support||{};
    const sections = [
      ['Getting started', [
        ['What is Pera?','Pera runs every purchase and payment through one approval path. You raise a requisition (to buy or pay) or an expense (to claim back money you spent), attach the supporting documents, and the approvers for that amount are notified. After approval, Finance reviews it, Procurement orders it or Finance pays it, and every step is recorded in the audit trail.'],
        ['Which role am I?','Your role is shown in the menu under your name at the top right. Requisitioners raise requests; approvers (usually executives) approve or reject; Procurement sources and orders; Finance reviews, captures invoices and pays; administrators manage settings and users. Suppliers use the supplier portal.'],
        ['What do the branches mean?','If your company has several branches, each record belongs to one. Use the branch picker at the top of the page (or the Company/branch level view on the dashboard) to see one branch at a time.']]],
      ['Requisitions & expenses', [
        ['How do I raise a requisition?','Click Create → Requisition. Choose Purchase (goods or services that need a purchase order) or Direct payment (fees, petty cash, claims). Fill in the lines, choose the budget line, attach quotes or invoices and click Submit for approval.'],
        ['Who approves my requisition?','The approval route depends on the amount, converted to the base currency. Everyone in that tier is notified; the required number must approve. You can see the route and each decision on the requisition page.'],
        ['What is “Pending review”?','After the approvers agree, Finance checks the budget code and documents before releasing it. If something is wrong they return it with a note.'],
        ['How do I claim back money I spent?','Use Create → Expense. Add the expense date, the amounts and a photo or scan of each receipt. Once approved and reviewed, Finance reimburses the payee.'],
        ['Can I copy an old requisition?','Yes. Click the copy icon in the Actions column of the Requisitions or Expenses list, or Duplicate on the record. A new draft opens with the same lines.'],
        ['What does Smart scan do?','Smart scan reads a PDF or photo of a quote, invoice or receipt and fills in the supplier, reference, dates, amounts and lines for you to check. It works best on typed PDFs; photos are read with text recognition and may need correcting.']]],
      ['Requests', [
        ['When do I use a request instead of a requisition?','Use a request for things from stores, repairs, IT support or facilities work. Procurement either issues the items from stock or converts the request into a requisition if it needs to be bought.'],
        ['What is a scheduled request?','A request that repeats every week, month or quarter. Pera creates a new pending request automatically on each due date.']]],
      ['Buying & paying', [
        ['How are purchase orders approved?','Procurement raises the PO from an approved requisition or RFQ award. It is approved by the PO approvers and reviewed by Finance before it is issued to the supplier.'],
        ['What is the 3-way match?','Before paying, Pera compares what was ordered (PO), what was received (delivery) and what was invoiced. If they differ by more than the tolerance in Settings, the invoice is flagged as a mismatch.'],
        ['How do RFQs and sealed bids work?','Procurement invites prequalified suppliers to quote. Sealed bids stay hidden until the closing time. Bids are then scored on price, delivery and technical quality and one is awarded with a written justification.']]],
      ['Suppliers & items', [
        ['What does “Connected” mean on a supplier?','The supplier has a login to the supplier portal, where they can quote on RFQs, see their purchase orders, submit invoices and upload documents. Use More actions → Invite to supplier portal to connect one.'],
        ['What are favourites and stock?','Tap the star on an item to add it to your favourites. Items marked “track stock” show their quantity on hand under the Stock tab; issuing a request from stores or receiving a delivery updates the quantity.']]],
      ['Records & audit', [
        ['Can records be deleted?','Transactions (requisitions, expenses, orders, invoices, payments) can never be deleted — drafts can be withdrawn and everything stays on record. Master data (items, categories, suppliers) can only be deleted if it has never been used; otherwise deactivate it.'],
        ['Where is the history of a record?','Every record page has an audit trail at the bottom. The full log, which can be exported, is under Plan & control → Audit trail.']]]
    ];
    const match = ([qq,a]) => !q || (qq+' '+a).toLowerCase().includes(q);
    return `${pageHead('Help center','Answers to common questions. Can’t find what you need? Contact support below.')}
      <section class="panel"><div class="filters"><input class="search" type="text" placeholder="Search help…" value="${esc((this.f.help||{}).q||'')}" data-filter="help.q" aria-label="Search help"></div>
      <div class="panel-b help">${sections.map(([h,qs])=>{ const m = qs.filter(match); return m.length?`<h3>${esc(h)}</h3>${m.map(([qq,a])=>`<details ${q?'open':''}><summary>${esc(qq)}</summary><p>${esc(a)}</p></details>`).join('')}`:''; }).join('') || '<p class="faint">No answers match your search.</p>'}</div></section>
      ${panel('Contact support','',`<div class="panel-b kv"><div><span>Email</span><b class="mono">${esc(sup.email||'—')}</b></div><div><span>Phone</span><b class="mono">${esc(sup.phone||'—')}</b></div><div><span>Hours</span><b>${esc(sup.hours||'—')}</b></div></div>`)}`;
  },
  /* ---------------- reports ---------------- */
  reportsPage(){
    const rs = Store.all('requisitions');
    const paid = rs.filter(r=>r.status==='paid');
    const P = r => toBase(r.currency, r.payment?r.payment.amount:r.total);
    const total = sum(paid,P);
    const decided = rs.filter(r=>r.submitted_at && r.decided_at);
    const avgApprove = decided.length ? sum(decided,r=>(new Date(r.decided_at)-new Date(r.submitted_at))/864e5)/decided.length : 0;
    const cycle = paid.filter(r=>r.submitted_at);
    const avgCycle = cycle.length ? sum(cycle,r=>(new Date(r.paid_at)-new Date(r.submitted_at))/864e5)/cycle.length : 0;
    const committedAll = rs.filter(r=>['approved','paid'].includes(r.status));
    const cv = sum(committedAll,r=>toBase(r.currency,r.total))||1;
    const underContract = sum(committedAll.filter(r=>r.contract_id),r=>toBase(r.currency,r.total))/cv*100;
    const competitive = sum(committedAll.filter(r=>rfqFor(r) || (r.attachments||[]).filter(a=>/quot/i.test(a.name)).length>=+S().quotes_required),r=>toBase(r.currency,r.total))/cv*100;
    const local = sum(committedAll.filter(r=>{const s=Store.sup(r.supplier_id); return s && (s.tags||[]).some(t=>['Local supplier','SME','Women-owned','Youth-owned'].includes(t));}),r=>toBase(r.currency,r.total))/cv*100;
    const group = (arr, key) => { const m={}; arr.forEach(r=>{ const k=key(r); m[k]=(m[k]||0)+P(r); }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
    const months = []; for (let i=11;i>=0;i--){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i); months.push(d.toISOString().slice(0,7)); }
    const mv = months.map(m=>[m, sum(paid.filter(r=>(r.paid_at||'').slice(0,7)===m),P)]);
    const mmax = Math.max(1,...mv.map(x=>x[1]));
    const sups = Store.all('suppliers').filter(s=>(s.reviews||[]).length || rs.some(r=>r.supplier_id===s.id)).map(s=>({s, spend:sum(paid.filter(r=>r.supplier_id===s.id),P), rating:supRating(s), orders:Store.all('purchase_orders').filter(p=>p.supplier_id===s.id).length, ontime:(()=>{ const g=Store.all('receipts').filter(x=>{const p=Store.byId('purchase_orders',x.po_id); return p&&p.supplier_id===s.id;}); return g.length? g.filter(x=>x.received_on<=(Store.byId('purchase_orders',x.po_id).delivery_date||x.received_on)).length/g.length*100 : null; })()})).sort((a,b)=>b.spend-a.spend);
    const kpi = (k,v,s) => `<div class="stat" style="cursor:default"><span class="k">${k}</span><span class="v">${v}</span><span class="s">${s}</span></div>`;
    return `${pageHead('Reports','Spend analysis, process speed and supplier performance. Paid amounts converted to '+baseCur()+' at the rates in Settings.', btn('Export spend CSV','data-act="export-spend"','','down'))}
      <div class="stats">
        ${kpi('Total paid spend',fmtK(total),baseCur()+' '+num(total)+' · '+paid.length+' payments')}
        ${kpi('Average approval time',avgApprove.toFixed(1)+' d','From submission to final decision')}
        ${kpi('Average request-to-pay',avgCycle.toFixed(1)+' d','From submission to payment')}
        ${kpi('Spend under contract',underContract.toFixed(0)+'%','Competitively sourced: '+competitive.toFixed(0)+'% · local/SME: '+local.toFixed(0)+'%')}
      </div>
      ${panel('Paid spend by month','<span class="faint">'+baseCur()+', last 12 months</span>',`<div class="panel-b"><div class="cols" role="img" aria-label="Monthly paid spend">${mv.map(([m,v])=>`<div class="c" title="${new Date(m+'-01T00:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'})}: ${baseCur()} ${num(v)}"><b>${v?fmtK(v):''}</b><i style="height:${v/mmax*100}%"></i><span>${new Date(m+'-01T00:00:00').toLocaleDateString('en-GB',{month:'short'})}</span></div>`).join('')}</div></div>`)}
      <div class="two">
        ${panel('By department','',`<div class="panel-b">${barRows(group(paid,r=>r.department||'—'),v=>baseCur()+' '+num(v))}</div>`)}
        ${panel('By category','',`<div class="panel-b">${barRows(group(paid,r=>Store.catName(r.category_id)),v=>baseCur()+' '+num(v))}</div>`)}
      </div>
      ${panel('Supplier performance','',tableHTML([{h:'Supplier',cls:'name',v:x=>esc(x.s.name)},{h:'Status',v:x=>pill(...SUP_STATUS[x.s.status])},{h:'Orders',r:1,cls:'num',v:x=>x.orders},{h:'On-time delivery',r:1,cls:'num',v:x=>x.ontime==null?'—':x.ontime.toFixed(0)+'%'},{h:'Rating',v:x=>stars(x.rating)},{h:'Paid spend',r:1,cls:'num',v:x=>num(x.spend)}], sups, {open:x=>'supplier:'+x.s.id}))}`;
  },

  /* ---------------- requisition detail ---------------- */
  reqDetail(){
    const r = Store.byId('requisitions',this.param);
    if (!r || !(can.seeAll(me()) || r.created_by===me().id)) return '<div class="empty">Record not found, or you don\u2019t have access to it.</div>';
    const T = r.kind==='expense'?'expense':'requisition', noun = r.kind==='expense'?'expense':'requisition';
    const u = me(), mine = r.created_by===u.id, stage = reqStage(r);
    const ids = r.approver_ids||[], yes = (r.approvals||[]).filter(a=>a.decision==='approved').length;
    const bud = Store.byId('budgets',r.budget_id), bu = bud?budgetUse(bud):null;
    const pos = posFor(r), q = rfqFor(r), invs = invoicesFor(r), m = matchFor(r);
    const support = (r.attachments||[]).filter(a=>a.kind!=='payment'), payDocs = (r.attachments||[]).filter(a=>a.kind==='payment');
    const trail = Store.all('audit_log').filter(a=>a.entity_id===r.id).sort((a,b)=>a.at.localeCompare(b.at));
    const decideOk = can.decide(u,r);

    // flow strip
    const rv = !!S().review_enabled || r.status==='review' || r.reviewed_at;
    const order = r.kind!=='purchase' ? ['draft','pending','review','to_pay','paid'] : ['draft','pending','review','to_order','sourcing','po_pending','ordered','received','to_pay','paid'];
    const idx = order.indexOf(stage);
    const steps = (r.kind!=='purchase'
      ? [[r.kind==='expense'?'Claim':'Requisition',['draft'],1],['Approval',['pending'],2],['Finance review',['review'],3],['Payment',['to_pay'],4]]
      : [['Requisition',['draft'],1],['Approval',['pending'],2],['Finance review',['review'],3],['Sourcing',['to_order','sourcing'],5],['Purchase order',['po_pending'],6],['Goods received',['ordered'],7],['Invoice',['received'],8],['Payment',['to_pay'],9]]).filter(x=>rv||x[0]!=='Finance review');
    const flow = ['rejected','withdrawn'].includes(r.status) ? '' : `<div class="flow">${steps.map(([l,now,doneAt])=>{
      const skip = l==='Sourcing' && !q && idx>=doneAt;
      const cls = skip ? 'skip' : idx>=doneAt ? 'done' : now.includes(stage) ? 'now' : '';
      return `<div class="st ${cls}"><b>${l}</b><span>${skip?'Not needed':cls==='done'?'Done':cls==='now'?'In progress':'—'}</span></div>`; }).join('')}</div>`;

    let banner='';
    const B = (tone, text, actions) => `<div class="banner ${tone}"><span class="grow">${text}</span>${actions||''}</div>`;
    if (r.status==='draft') banner = B('blue','<b>Draft.</b> Approvers are not notified until you submit.', mine?btn('Edit','data-act="req-edit"','sm')+btn('Submit for approval','data-act="req-submit"','sm primary'):'');
    else if (r.status==='pending') banner = B('amber',`<b>Waiting for approval — ${stagesOf(r).length>1&&currentStage(r)>=0?'step '+(currentStage(r)+1)+' of '+stagesOf(r).length+', '+esc(stagesOf(r)[currentStage(r)].label):yes+' of '+r.approvals_required+' required'}</b> (${esc(r.tier_label)} tier) · ${slaPill(r)} ${decideOk?'Your decision is needed.':(r.approvals||[]).some(a=>a.approver_id===u.id)?'You have recorded your decision.':''}`, mine?btn('Withdraw','data-act="req-withdraw"','sm'):'');
    else if (r.status==='review') banner = B('amber',`<b>Approved — waiting for Finance review</b> before release. Finance checks the budget line, documents and payee details.`, can.review(u)?btn('Return','data-act="review" data-ok="0" data-t="requisitions"','sm danger')+btn('Release','data-act="review" data-ok="1" data-t="requisitions"','sm primary'):'');
    else if (r.status==='rejected') banner = B('red',`<b>Rejected.</b> ${esc(((r.approvals||[]).find(a=>a.decision==='rejected')||{}).comment||'')}`, mine?btn('Revise & resubmit as new','data-act="req-revise"','sm'):'');
    else if (r.status==='withdrawn') banner = B('blue','<b>Withdrawn</b> by the requisitioner. Kept on record for audit.');
    else if (r.status==='paid') banner = B('green',`<b>Paid</b> on ${fmtDate(r.payment.paid_on)} · ref <span class="mono">${esc(r.payment.reference)}</span> · by ${esc(r.payment.paid_by_name)}`);
    else {
      const acts = [];

      if ((stage==='received' || (stage==='ordered'&&!S().require_grn)) && can.finance(u)) acts.push(btn('Capture invoice','data-act="inv-new" data-id="'+pos[0].id+'"','sm primary'));

      </div>`) : '';
    return `

      <div class="print-only print-head">${brandMark()}<div><b>${esc(S().company||'')}</b><span>${r.kind==='expense'?'Expense claim':'Requisition'} ${esc(r.number)} · ${esc((STAGE[stage]||[r.status])[0])} · printed ${fmtDT(nowISO())} by ${esc(u.name)}</span></div></div>
      ${pageHead(esc(r.title), `${esc(Store.user(r.created_by).name)} · ${esc(r.department||'')} · ${esc(branchName(r.branch_id))} · created ${fmtDT(r.created_at)}`, stagePill(r)+' '+btn('Duplicate','data-act="duplicate" data-id="'+r.id+'"','sm','copy')+' '+btn('PDF','data-act="req-print"','sm','print'), esc(r.number)+' · '+esc(r.kind==='payment'?'Direct payment':r.kind==='expense'?'Expense claim':'Purchase'))}
      ${flow}${banner}${this.reqWarnings(r)}

              <div><span>${r.kind==='expense'?'Payee (reimburse to)':'Supplier / payee'}</span><b>${payee}</b></div>${r.kind==='expense'?`<div><span>Expense date</span><b>${fmtDate(r.expense_date)}</b></div>`:''}<div><span>Category</span><b>${esc(Store.catName(r.category_id))}</b></div>
              <div><span>Budget line</span><b>${bud?esc(bud.code+' – '+bud.name):'—'}</b></div><div><span>Payment method</span><b>${esc(r.payment_method||'—')}</b></div>
              <div><span>Due date</span><b class="${isOverdue(r)?'over':''}">${fmtDate(r.due_date)}</b></div><div><span>Contract</span><b>${ct?esc(ct.number+' – '+ct.title):'—'}</b></div>

  /* ---------------- request detail ---------------- */
  requestDetail(){

    const items = (r.items||[]).map(i=>Object.assign({}, i, {it:Store.byId('items',i.item_id)}));
    const fromStock = items.length && items.every(i=>i.it && i.it.track_stock && i.it.stock_qty>=i.qty);
    const B = (tone, text, a) => `<div class="banner ${tone}"><span class="grow">${text}</span>${a||''}</div>`;
    const req = Store.byId('requisitions',r.req_id);
    let banner = '';
    if (r.status==='draft') banner = B('blue','<b>Draft.</b> Procurement is not notified until you submit.', mine?btn('Edit','data-act="rq-edit"','sm')+btn('Submit','data-act="rq-submit"','sm primary'):'');
    else if (r.status==='pending') banner = B('amber','<b>Waiting for Procurement</b> to accept and assign it.', (can.procure(u)?btn('Accept & assign','data-act="rq-accept"','sm primary'):'')+(mine||can.procure(u)?btn('Cancel request','data-act="rq-cancel"','sm danger'):''));
    else if (r.status==='open') banner = B('blue',`<b>Open</b> — assigned to ${esc(Store.user(r.assigned_to).name)}.${req?' Requisition <button class="link mono" data-open="requisition:'+req.id+'">'+esc(req.number)+'</button> is '+esc((STAGE[reqStage(req)]||[''])[0].toLowerCase())+'.':''}`,

    return `<div>${btn('Back','data-act="back"','sm ghost','back')}</div>
      ${pageHead(esc(r.title), `${esc(Store.user(r.created_by).name)} · ${esc(r.department||'')} · ${esc(branchName(r.branch_id))} · created ${fmtDT(r.created_at)}`, pill(...(REQ_STATUS[r.status]||[r.status,'t-grey']))+' '+btn('Duplicate','data-act="rq-dup" data-id="'+r.id+'"','sm','copy'), esc(r.number)+' · '+esc(r.type))}
      ${banner}
      <div class="detail">
        <div class="stack">
          ${panel('Details','',`<div class="panel-b" style="display:flex;flex-direction:column;gap:14px"><div class="kv">
            <div><span>Type</span><b>${esc(r.type)}</b></div><div><span>Category</span><b>${esc(Store.catName(r.category_id))}</b></div><div><span>Priority</span><b>${esc(r.priority)}</b></div>
            <div><span>Needed by</span><b>${fmtDate(r.needed_by)}</b></div><div><span>Assigned to</span><b>${r.assigned_to?esc(Store.user(r.assigned_to).name):'—'}</b></div><div><span>Repeats</span><b>${esc(RECURRENCE[r.recurrence||'none'])}</b></div>
            ${r.parent_id?`<div><span>Created from schedule</span><b><button class="link mono" data-open="request:${r.parent_id}">${esc((Store.byId('requests',r.parent_id)||{}).number||'')}</button></b></div>`:''}</div>
            ${r.description?`<p style="margin:0;white-space:pre-wrap">${esc(r.description)}</p>`:''}</div>
            ${tableHTML([{h:'Item or service',v:i=>esc(i.description)},{h:'Qty',r:1,cls:'num',v:i=>i.qty},{h:'In stores',r:1,cls:'num',v:i=>i.it&&i.it.track_stock?`<span class="${i.it.stock_qty<i.qty?'over':''}">${i.it.stock_qty}</span>`:'<span class="faint">Not stocked</span>'}], items)}`)}
          ${panel('Attachments','',`<div class="panel-b">${fileList(r.attachments||[],'requests:'+r.id)}</div>`)}
          ${children.length?panel('Requests created by this schedule','',tableHTML([{h:'Number',cls:'mono',v:x=>esc(x.number)},{h:'Created',cls:'nw',v:x=>fmtDate(x.created_at)},{h:'Status',v:x=>pill(...REQ_STATUS[x.status])}], children, {open:x=>'request:'+x.id})):''}
          ${this.commentsPanel('request',r)}
          ${panel('Audit trail','',`<div class="panel-b timeline">${Store.all('audit_log').filter(a=>a.entity_id===r.id).sort((a,b)=>a.at.localeCompare(b.at)).map(a=>`<div class="ev"><time>${fmtDT(a.at)}</time><div><b>${esc(a.action)}</b> — ${esc(a.user_name)} <span class="muted">${esc(a.details)}</span></div></div>`).join('')}</div>`)}
        </div>
        <div class="stack">${panel('What happens next','',`<div class="panel-b"><ol style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px"><li>Procurement accepts the request and assigns someone.</li><li>If the items are in stores, they are issued and stock is reduced.</li><li>If not, it becomes a requisition that goes through approval.</li><li>You are notified when it is completed.</li></ol></div>`)}</div>
      </div>`;
  },

const M = {
  open(html, narrow){
    this.close();
    const o = document.createElement('div'); o.className='overlay'; o.id='overlay';
    o.innerHTML = `<div class="modal ${narrow?'narrow':''}" role="dialog" aria-modal="true">${html}</div>`;
    document.body.appendChild(o);
    o.addEventListener('mousedown',e=>{ if(e.target===o) this.close(); });
    const f = o.querySelector('.modal-b input:not([type=checkbox]):not([type=file]),.modal-b select,.modal-b textarea'); f && f.focus();
    return o;
  },
  close(){ const o=$('#overlay'); if(o) o.remove(); (this._blobs||[]).forEach(u=>URL.revokeObjectURL(u)); this._blobs=[]; },
  head(title){ return `<div class="modal-h"><h2>${title}</h2><button class="icon-btn" data-close aria-label="Close">${I.x}</button></div>`; },
  err(msg){ const e=$('#m-err'); if(e){ e.hidden=!msg; e.textContent=msg||''; } },
  busy(on){ $$('.modal-f .btn').forEach(b=>b.disabled=on); }
};
function fieldHTML(f, v){
  const id = 'fm-'+f.k, val = v==null ? '' : v;
  let inp;
  switch(f.type){
    case 'textarea': inp=`<textarea id="${id}">${esc(val)}</textarea>`; break;
    case 'select': inp=`<select id="${id}">${f.blank!==false?`<option value="">${esc(f.blank||'—')}</option>`:''}${f.options.map(([k,l])=>`<option value="${esc(k)}" ${String(k)===String(val)?'selected':''}>${esc(l)}</option>`).join('')}</select>`; break;
    case 'checks': inp=`<div class="checks" id="${id}">${f.options.map(([k,l])=>`<label class="chk"><input type="checkbox" value="${esc(k)}" ${(val||[]).includes(k)?'checked':''}> ${esc(l)}</label>`).join('')}</div>`; break;
    case 'bool': return `<label class="chk ${f.span?'span-all':''}"><input type="checkbox" id="${id}" ${val?'checked':''}> ${esc(f.label)}</label>`;
    case 'files': return `<div class="span-all"><b>${esc(f.label)}</b>${f.req?' <span style="color:var(--red)">*</span>':''}${f.help?`<p class="faint" style="margin:2px 0 8px;font-size:12.5px">${esc(f.help)}</p>`:''}<label class="drop" id="${id}-drop" for="${id}" style="margin-top:6px">Drop files here or <u>browse</u><input id="${id}" type="file" multiple></label><div class="files" id="${id}-list" style="margin-top:8px"></div></div>`;
    default: inp=`<input id="${id}" type="${f.type||'text'}" ${f.step?`step="${f.step}"`:''} value="${esc(val)}" ${f.ph?`placeholder="${esc(f.ph)}"`:''}>`;
  }
  return `<label class="f ${f.span==='all'||f.type==='textarea'||f.type==='checks'?'span-all':f.span?'span-2':''}" for="${id}">${esc(f.label)}${f.req?' <span class="req">*</span>':''}${f.help?`<span class="help">${esc(f.help)}</span>`:''}${inp}</label>`;
}
function readFields(fields){
  const o = {};
  for (const f of fields){
    const el = $('#fm-'+f.k); if (!el || f.type==='files') continue;
    if (f.type==='checks') o[f.k] = $$('input:checked',el).map(x=>x.value);
    else if (f.type==='bool') o[f.k] = el.checked;
    else if (f.type==='number') o[f.k] = el.value==='' ? null : +el.value;
    else o[f.k] = el.value.trim();
  }
  return o;
}
const fileBins = {};
function wireFiles(id){
  fileBins[id] = [];
  const input = $('#'+id), drop = $('#'+id+'-drop'), list = $('#'+id+'-list');
  if (!input) return;
  const draw = () => { list.innerHTML = fileBins[id].map((f,i)=>`<div class="file"><span class="ft">${esc(f.name.split('.').pop().slice(0,4).toUpperCase())}</span><div class="fn"><b>${esc(f.name)}</b><span>${fmtSize(f.size)} · ready to upload</span></div><button type="button" class="btn sm ghost" data-rmfile="${id}:${i}" aria-label="Remove">${I.x}</button></div>`).join(''); };
  fileBins[id]._draw = draw;
  input.addEventListener('change',e=>{ fileBins[id].push(...e.target.files); e.target.value=''; draw(); });
  ['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
  drop.addEventListener('drop',e=>{ fileBins[id].push(...e.dataTransfer.files); draw(); });
}
function formModal(o){
  M.open(`${M.head(o.title)}<div class="modal-b">${o.intro||''}<div class="grid-form">${o.fields.map(f=>fieldHTML(f,(o.values||{})[f.k])).join('')}</div>${o.extra||''}<div class="err" id="m-err" hidden></div></div>
    <div class="modal-f"><button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="fm-save">${esc(o.save||'Save')}</button></div>`, o.narrow!==false);
  o.fields.filter(f=>f.type==='files').forEach(f=>wireFiles('fm-'+f.k));
  $('#fm-save').addEventListener('click', async ()=>{
    const v = readFields(o.fields);
    const miss = o.fields.filter(f=>f.req && f.type!=='files' && (v[f.k]==null || v[f.k]==='' || (Array.isArray(v[f.k])&&!v[f.k].length)));
    const missF = o.fields.filter(f=>f.req && f.type==='files' && !(fileBins['fm-'+f.k]||[]).length);
    if (miss.length||missF.length) return M.err('Fill in '+miss.concat(missF).map(f=>f.label.toLowerCase()).join(', ')+'.');
    const files = {}; o.fields.filter(f=>f.type==='files').forEach(f=>files[f.k]=fileBins['fm-'+f.k]||[]);
    M.busy(true);
    try{ const msg = await o.onSave(v, files); M.close(); App.render(); if (msg!==false) App.toast(msg||'Saved'); }
    catch(e){ console.error(e); M.err(e.message||String(e)); M.busy(false); }
  });
}

    const exp = v('rf-kind')==='expense';
    const lines = Ed.clean(), problems = [];
    if (!v('rf-title')) problems.push(exp?'an expense name':'a requisition name');
    if (submit){
      if (!v('rf-cat')) problems.push('a category');
      if (mod('budgets') && !v('rf-budget')) problems.push('a budget line');
      if (!v('rf-due')) problems.push('a due date');
      if (!v('rf-desc')) problems.push(exp?'what it was for':'a justification');
      if (exp && !v('rf-expdate')) problems.push('the expense date');
      if (exp && v('rf-expdate') > todayStr()) problems.push('an expense date that is not in the future');
      if (exp && !v('rf-payee')) problems.push('who to reimburse');
      if (v('rf-due') && v('rf-due') < todayStr()) problems.push((exp?'a reimburse-by':'a due')+' date that is today or later (it can’t already be past when you submit)');
      if (!lines.length || lines.some(l=>!l.description||l.qty<=0||l.unit_price<=0)) problems.push('at least one line with a description, quantity and price');
      const docs = ((this._reqEdit||{}).attachments||[]).length + fileBins['rf-files'].length;
      if (S().require_documents && !docs) problems.push(exp?'at least one receipt':'at least one supporting document');
      const s = Store.sup(v('rf-sup')); if (s && S().approved_suppliers_only && s.status!=='approved') problems.push('a prequalified supplier ('+s.name+' is '+s.status+')');
      const creator = (this._reqEdit||{}).created_by || me().id;
      if (!routeFor(pickTier(v('rf-cur'),linesTotal(lines)), creator).ids.length) problems.push('an approver other than yourself under Settings (nobody can approve their own request)');
      const bl = Store.byId('budgets', v('rf-budget'));
      if (bl && S().budget_control==='block'){ const bu=budgetUse(bl), mine=this._reqEdit&&['pending','review','approved'].includes(this._reqEdit.status)?toBase(this._reqEdit.currency,this._reqEdit.total):0, after=bu.available+mine-toBase(v('rf-cur'),linesTotal(lines));
        if (after < 0) problems.push('budget headroom on '+bl.code+' (it would be over-committed by '+baseCur()+' '+num(-after)+' and budget control is set to block)'); }
    }
    if (problems.length) return M.err('To '+(submit?'submit':'save')+', add '+problems.join(', ')+'.');
    let dupNote = (this._reqEdit||{}).dup_note || null;
    if (submit){
      const dups = findDuplicates({id:(this._reqEdit||{}).id, kind:v('rf-kind'), supplier_id:v('rf-sup')||null, payee:v('rf-payee'), title:v('rf-title'), currency:v('rf-cur'), total:linesTotal(lines)});
      if (dups.length){
        const ok = $('#rf-dup-ok'), why = v('rf-dup-why');
        if (!ok || !ok.checked || !why){
          if (!ok) $('#rf-dup').innerHTML = `<div class="note warn"><b>This looks like ${dups.length===1?'a requisition':'requisitions'} already in the system:</b><ul class="dup-list">${dupListHTML(dups, {})}</ul>
            <label class="chk" style="margin-top:6px"><input type="checkbox" id="rf-dup-ok"> I have checked — this is not a duplicate</label>
            <label class="f" for="rf-dup-why" style="margin-top:6px">Why it is different <span class="req">*</span><input id="rf-dup-why" type="text" placeholder="e.g. second instalment, different invoice number"></label></div>`;
          $('#rf-dup').scrollIntoView({block:'center'});
          return M.err('Possible duplicate — confirm it below before submitting, or cancel.');
        }
        dupNote = why;
      }
    }
    M.busy(true);
    try{
      const addr = id => { const a = addrList().find(x=>x.id===id); return a ? addrText(a) : null; };
      const base = {title:v('rf-title'), kind:v('rf-kind'), description:v('rf-desc'), category_id:v('rf-cat')||null, supplier_id:v('rf-sup')||null, payee:v('rf-payee'), contract_id:v('rf-ct')||null, budget_id:v('rf-budget')||null, department:v('rf-dept'), branch_id:v('rf-branch')||null, currency:v('rf-cur'), payment_method:v('rf-pm'), due_date:v('rf-due')||null, expense_date:exp?(v('rf-expdate')||null):null, lines, total:linesTotal(lines),
        pay_from_id:v('rf-payfrom')||null, delivery_address_id:exp?null:(v('rf-deliv')||null), delivery_address:exp?null:addr(v('rf-deliv')), distribution_address_id:exp?null:(v('rf-dist')||null), distribution_address:exp?null:addr(v('rf-dist')), dup_note:dupNote};
      const T = exp?'expense':'requisition';
      let r;
      if (this._reqEdit){ r = await Store.update('requisitions', this._reqEdit.id, base); await Store.log(T,r,'Edited','Draft updated'); }
      else {
        const row = Object.assign({id:uid(), created_by:me().id, created_at:nowISO(), status:'draft', approvals:[], attachments:[], payment:null, approver_ids:[], approvals_required:0, tier_label:'', plan_line_id:(this._reqPreset||{}).plan_line_id||null}, base);
        if (!LIVE) row.number = Store.nextNumber('requisitions', exp?'EX-':'R-');
        r = await Store.insert('requisitions', row);
        await Store.log(T,r,'Created',(this._reqPreset||{})._from ? (this._reqPreset._from) : 'Draft saved');
        if (r.plan_line_id){ const pl=Store.byId('plan_lines',r.plan_line_id); if (pl) await Store.update('plan_lines',pl.id,{status:'requisitioned',req_id:r.id}); }
        const rqId = (this._reqPreset||{})._request;
        if (rqId){ const rq=Store.byId('requests',rqId); if (rq){ await Store.update('requests',rq.id,{req_id:r.id}); await Store.log('request',rq,'Converted to requisition',r.number); await Store.notify([rq.created_by],'request',rq,rq.number+' is being bought through requisition '+r.number); } }
      }
      const files = fileBins['rf-files'];
      if (files.length){ const atts=(r.attachments||[]).slice(); for (const f of files) atts.push(await Store.putFile(f,'requisitions/'+r.id,'support')); r = await Store.update('requisitions',r.id,{attachments:atts}); await Store.log(T,r,'Documents uploaded',files.map(f=>f.name).join(', ')); }
      if (submit){
        if (dupNote && dupNote!==(this._reqEdit||{}).dup_note) await Store.log(T, r, 'Possible duplicate acknowledged', dupNote);
        if (!(await this.reqSubmit(r, {skipDup:true}))){ M.close(); this.go('req',r.id); return; }
      }
      M.close(); this.go('req',r.id);
      this.toast(submit?'Submitted — approvers notified':'Draft saved');
    }catch(e){ console.error(e); M.err('Could not save: '+(e.message||e)); M.busy(false); }
  },
  async reqSubmit(r){
    if (S().require_documents && !(r.attachments||[]).length){ this.toast('Attach at least one supporting document before submitting'); return false; }
    if (r.due_date && r.due_date < todayStr()){ this.toast('The due date ('+fmtDate(r.due_date)+') has passed — edit the draft and choose today or a later date'); return false; }
    const t = pickTier(r.currency, r.total), T = r.kind==='expense'?'expense':'requisition';
    const rt = routeFor(t, r.created_by);
    if (!rt.ids.length){ this.toast('Nobody else can approve this - ask an administrator to add another approver to the '+t.label+' tier'); return false; }
    const purchaser = r.purchaser_id || (r.kind==='purchase' ? S().default_purchaser_id||null : null);
    r = await Store.update('requisitions', r.id, {status:'pending', submitted_at:nowISO(), approvals:[], approver_ids:rt.ids, approvals_required:rt.multi?rt.required:rt.stages[0].required, stages:rt.multi?rt.stages:[], tier_label:t.label, purchaser_id:purchaser});
    const first = stagesOf(r)[0];
    await Store.log(T,r,'Submitted for approval', t.label+' tier – '+(rt.multi?stagesOf(r).map((s,i)=>'step '+(i+1)+' '+s.label+': '+s.required+' of '+s.ids.length).join(', ')+'. Notified step 1: ':r.approvals_required+' of '+r.approver_ids.length+' approvals needed. Notified: ')+first.ids.map(a=>Store.user(a).name).join(', '));
    await Store.notify(withDelegates(first.ids),T,r,'New '+(T==='expense'?'expense claim ':'requisition ')+r.number+' – '+r.title+' ('+fmtMoney(r.currency,r.total)+') from '+me().name+' needs your approval'+(rt.multi?' – step 1 of '+stagesOf(r).length:''));
    return true;
  },

  async poSubmit(p){
    const pa = S().po_approval||{};
    const pids = approversExcluding(pa.approver_ids, p.created_by);
    if (pa.enabled && (pa.approver_ids||[]).length && !pids.length){ this.toast('You are the only PO approver - another approver is needed (nobody approves their own PO)'); return p; }
    if (pa.enabled && pids.length){
      p = await Store.update('purchase_orders',p.id,{status:'pending_approval', submitted_at:nowISO(), approvals:[], approver_ids:pids, approvals_required:Math.min(+pa.required||1, pids.length)});
      await Store.log('po',p,'Submitted for approval','Approvers: '+p.approver_ids.map(a=>Store.user(a).name).join(', '));
      await Store.notify(withDelegates(p.approver_ids),'po',p,'Purchase order '+p.number+' ('+Store.supName(p.supplier_id)+', '+fmtMoney(p.currency,p.total)+') needs your approval');
    } else if (S().review_enabled){

      if (att.sha256){ try{ const now = await sha256Of(await (await fetch(url)).blob()); integ = !now ? '' : now===att.sha256 ? ' · <span style="color:var(--green)">Fingerprint verified ✓</span>' : ' · <b style="color:var(--red)">WARNING: this file has changed since it was uploaded</b>'; if (now && now!==att.sha256) await Store.log('file',{id:att.id,number:att.name},'Fingerprint mismatch','Stored file no longer matches its SHA-256 fingerprint'); }catch(e){} }
      const img = /^image\//.test(att.type)||/\.(png|jpe?g|gif|webp)$/i.test(att.name), pdf=/pdf/.test(att.type)||/\.pdf$/i.test(att.name);
      M.open(`${M.head(esc(att.name))}<div class="modal-b">${img?`<img src="${url}" alt="${esc(att.name)}" style="max-height:70vh;object-fit:contain">`:pdf?`<iframe class="preview-frame" src="${url}" title="${esc(att.name)}"></iframe>`:'<p class="muted">No preview for this file type — download it to open.</p>'}
        <p class="faint" style="margin:0;font-size:12.5px">Uploaded by ${esc(att.uploaded_by_name)} on ${fmtDT(att.at)} · ${fmtSize(att.size)}${att.sha256?' · SHA-256 <span class="mono">'+esc(att.sha256.slice(0,16))+'…</span>':''}${integ}</p></div>
        <div class="modal-f"><a class="btn primary" href="${url}" download="${esc(att.name)}" target="_blank" rel="noopener">${I.down}Download</a></div>`);

document.addEventListener('click', async e=>{
  if (e.target.closest('[data-stop]')) return;
  const rm = e.target.closest('[data-rmfile]');
  if (rm){ const [id,i]=rm.dataset.rmfile.split(':'); fileBins[id].splice(+i,1); fileBins[id]._draw(); return; }
  const t = e.target.closest('[data-close],[data-go],[data-open],[data-act],[data-tab],[data-note],[data-view]');
  if (!t){ if (App.menu && !e.target.closest('.dropdown')){ App.menu=null; App.render(); } return; }
  if (t.dataset.close!==undefined) return M.close();
  if (t.dataset.go){ if (t.dataset.tab){ const [k,v]=t.dataset.tab.split(':'); App.tab[k]=v; } return App.go(t.dataset.go); }
  if (t.dataset.open!==undefined){ if (t.dataset.open) App.open(t.dataset.open); return; }
  if (t.dataset.tab){ const [k,v]=t.dataset.tab.split(':'); App.tab[k]=v; return App.render(); }
  if (t.dataset.note){ const n=Store.byId('notifications',t.dataset.note); if (!n) return; if (!n.read){ n.read=true; if(LIVE) Store.update('notifications',n.id,{read:true}).catch(()=>{}); else Store.persist(); } App.menu=null; App.open(n.entity_type+':'+n.entity_id); return App.render(); }
  if (t.dataset.view) return App.viewFile(t.dataset.view);
  const f = ACT[t.dataset.act]; if (f) { try{ await f(t); }catch(err){ console.error(err); App.toast('Something went wrong: '+(err.message||err)); } }
});
document.addEventListener('change', async e=>{
  const t = e.target;
  if (t.dataset.act==='switch-user'){ Store.me=Store.byId('app_users',t.value); Store.persist(); App.back=[]; App.menu=null; App.dashView=null; App.go(Store.me.role==='supplier'?'portal':(['req','rfq','po','supplier','contract','request'].includes(App.view)&&can.seeAll(Store.me)?App.view:'dashboard'), App.param); return; }
  if (t.dataset.act==='pay-all'){ ACT['pay-all'](t); return; }

  if (t.dataset.tech){ const b=Store.byId('bids',t.dataset.tech); const v=Math.max(0,Math.min(100,+t.value||0)); await Store.update('bids',b.id,{technical_score:v}); const q=Store.byId('rfqs',b.rfq_id); await Store.log('rfq',q,'Technical score entered',Store.supName(b.supplier_id)+': '+v); App.render(); return; }

   MORE ACTIONS: requests, stock, favourites, suppliers, categories,
   comments, columns, menus, schedules

function entityOf(type, id){
  const t = {requisition:'requisitions', expense:'requisitions', po:'purchase_orders', contract:'contracts', request:'requests', rfq:'rfqs'}[type];
  return t ? Store.byId(t, id) : null;
}
function mentions(body){
  const words = (String(body).match(/@([A-Za-z][\w'-]*)/g)||[]).map(w=>w.slice(1).toLowerCase());
  if (!words.length) return [];
  return Store.all('app_users').filter(u=>u.active && words.some(w=>u.name.toLowerCase().split(/\s+/).includes(w))).map(u=>u.id);
}
async function stockMove(item, qty, reason, ref){
  const row = {id:uid(), item_id:item.id, qty, reason, ref:ref||'', user_id:me().id, user_name:me().name, at:nowISO()};
  if (LIVE){ const {error}=await Store.sb.from('stock_moves').insert(row); if (error) throw error; await Store.reloadTables(['items','stock_moves']); }
  else { Store.data.stock_moves.push(row); item.stock_qty = round2((+item.stock_qty||0) + qty); item.updated_at = nowISO(); Store.persist(); }
  const it = Store.byId('items', item.id);
  if (it && it.track_stock && it.stock_qty <= it.reorder_level) await Store.notify(usersWhere(u=>u.role==='procurement'),'item',it, it.name+' is at '+it.stock_qty+' '+(it.uom||'')+' — at or below its reorder level of '+it.reorder_level);
}
const nextRun = (d, rec) => addDays(d, rec==='weekly'?7 : rec==='quarterly'?91 : 30);
async function runSchedules(){
  if (LIVE) return 0;
  let made = 0;
  for (const t of Store.all('requests').filter(r=>r.status==='scheduled' && r.next_run && r.next_run<=todayStr())){
    let guard = 0;
    while (t.next_run<=todayStr() && guard++<6){ await createFromSchedule(t, t.next_run); made++; }
  }
  return made;
}
async function createFromSchedule(t, due){
  const row = {id:uid(), title:t.title.replace(/\s*\((weekly|monthly|quarterly)\)\s*$/i,'')+' – '+fmtDate(due), description:'Created automatically from the '+RECURRENCE[t.recurrence].toLowerCase()+' schedule '+t.number+'.', type:t.type, category_id:t.category_id, department:t.department, branch_id:t.branch_id,
    items:JSON.parse(JSON.stringify(t.items||[])), needed_by:due, priority:t.priority, status:'pending', recurrence:'none', next_run:null, parent_id:t.id, req_id:null, assigned_to:null, completed_at:null, resolution:'', attachments:[], created_by:t.created_by, created_at:nowISO(), updated_at:nowISO()};
  if (!LIVE) row.number = Store.nextNumber('requests','RQ-');
  const r = await Store.insert('requests', row);
  await Store.update('requests', t.id, {next_run:nextRun(t.next_run||todayStr(), t.recurrence)});
  await Store.log('request', r, 'Created from schedule', t.number);
  await Store.notify([t.created_by, ...usersWhere(u=>u.role==='procurement')], 'request', r, 'New request '+r.number+' – '+r.title+' (from schedule '+t.number+')');
  return r;
}
